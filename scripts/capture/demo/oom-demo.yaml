# Deploiement temporaire servant a provoquer un OOMKill reel (scenario 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: devops-platform
  labels: {app.kubernetes.io/name: oom-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: oom-demo}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oom-demo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: leaker
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              fuite = []
              while True:
                  fuite.append(bytearray(8 * 1024 * 1024))   # +8 Mio toutes les 0,5 s
                  print("memoire retenue : %d Mio" % (len(fuite) * 8), flush=True)
                  time.sleep(0.5)
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 64Mi, cpu: 100m}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
