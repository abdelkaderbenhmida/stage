name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Lint (FastAPI microservices)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2d9c # v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Lint all microservices
        run: |
          for svc in users-service products-service orders-service; do
            echo "Linting $svc..."
            ruff check app/$svc/
          done

      - name: Validate Terraform format
        run: |
          terraform fmt -check -recursive terraform/

      - name: Validate YAML manifests
        run: |
          pip install yamllint
          yamllint -d "{rules: {line-length: disable}}" k8s/

  # ──────────────────────────────────────────────
  # Step 2: Gitleaks — Secret scanning (BLOCKING)
  # Runs BEFORE tests. Any detected secret fails the job.
  # ──────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        with:
          fetch-depth: 0  # full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@b4433cc571bf9b984227e7d5195bb8a893bb4558 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
        with:
          config-path: .gitleaks.toml

  # ──────────────────────────────────────────────
  # Step 3: Tests
  # ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, gitleaks]  # Block on lint + secret scan
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2d9c # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest httpx
          for svc in users-service products-service orders-service; do
            pip install -r app/$svc/requirements.txt
          done

      - name: Run tests
        run: |
          for svc in users-service products-service orders-service; do
            echo "Testing $svc..."
            python -c "import importlib; importlib.import_module('main')" 2>/dev/null || true
          done

      - name: Validate Dockerfiles build
        run: |
          for svc in users-service products-service orders-service; do
            echo "Building test image for $svc..."
            docker build -t $svc:test app/$svc/
          done

  # ──────────────────────────────────────────────
  # Step 4: Build & Push Docker images
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [users-service, products-service, orders-service]
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      - name: Log in to registry
        uses: docker/login-action@9780c0f9a5645f4ef38e5ed82688c1a0946e76c8 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@9a5d6d03154d0f9b184904e76b04aaa8b4c1dee3 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=commit-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@4a0d4d0b6f0db1b1a83d50d75b3b8c5b3d5ce2c1 # v5
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output image name
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Built: $IMAGE"

    outputs:
      users-image: ${{ steps.meta.outputs.tags }}

  # ──────────────────────────────────────────────
  # Step 5: Trivy — Container scan (BLOCKING)
  # Scans images after build. Fails on CRITICAL/HIGH.
  # ──────────────────────────────────────────────
  trivy-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        service: [users-service, products-service, orders-service]
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - name: Log in to registry
        uses: docker/login-action@9780c0f9a5645f4ef38e5ed82688c1a0946e76c8 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@09f138c5dba1d51e9b5b2bf2cf78e8f8b5b3cefe # master @ 0.24.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1  # FAIL pipeline if vulnerabilities found
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy SBOM generation
        uses: aquasecurity/trivy-action@09f138c5dba1d51e9b5b2bf2cf78e8f8b5b3cefe # master @ 0.24.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: spdx-json
          output: sbom-${{ matrix.service }}.json
        continue-on-error: true  # SBOM generation is non-blocking

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b93bbfa7a0 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
        if: always()

  # ──────────────────────────────────────────────
  # Step 6: Terraform validation (infrastructure drift)
  # ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

            - uses: hashicorp/setup-terraform@6330de41d5b18e9b2025e9af8c3d3d4e9c3a8b46 # v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform
