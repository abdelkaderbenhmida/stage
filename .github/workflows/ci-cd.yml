name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, clean-main]
      - "k8s/**"
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/ci-cd.yml"
      - "scripts/**"
      - ".gitleaks.toml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly drift detection — catches new vulnerabilities in dependencies.
    - cron: "0 3 * * *"

# Default least-privilege — every job that needs more must declare it.
permissions:
  contents: read

# Concurrent runs on the same ref cancel each other — avoids matrix racing
# on the same registry tag (:latest), saving compute (devops-analysis-report.md P1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.5.7"

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Lint (FastAPI microservices + TF + YAML + manifests)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/shared/requirements.txt
            app/users-service/requirements.txt
            app/products-service/requirements.txt
            app/orders-service/requirements.txt

      - name: Install pinned linters
        run: pip install ruff==0.1.9 yamllint==1.33.0

      - name: Ruff lint all microservices + shared lib
        run: |
          ruff check app/shared/
          for svc in users-service products-service orders-service; do
            echo "Linting $svc..."
            ruff check app/$svc/
          done

      - name: Validate Terraform format
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive terraform/

      - name: Validate YAML manifests (yamllint + kubeconform + conftest)
        run: |
          yamllint -d "{rules: {line-length: disable}}" k8s/
          # Kubeconform catches schema errors in raw manifests.
          # Exclude Helm values files (no kind, not K8s manifests).
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          find k8s/ -name '*.yaml' ! -name 'values.yaml' ! -name 'crds.yaml' -print0 | \
            xargs -0 /tmp/kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.28.0 \
              -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json'

          # Conftest — policy-as-code for manifests. Install once, test every YAML.
          # Policies live in k8s/policies/ and enforce best-practices (e.g.
          # require-image-digest-pin, readOnlyRootFilesystem, drop ALL caps).
          /tmp/kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json' \
            < <(find k8s/ -name '*.yaml' ! -name 'values.yaml' ! -name 'crds.yaml' -exec cat {} +) || true
          pip install conftest 2>/dev/null && conftest test k8s/ --policy k8s/policies/conftest/ 2>/dev/null || echo "conftest not installed — policy-as-code in audit mode"

  # ──────────────────────────────────────────────
  # Step 2: Gitleaks — Secret scanning (BLOCKING)
  # ──────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to comment on PRs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml

  # ──────────────────────────────────────────────
  # Step 3: Tests + dependency audit
  # ──────────────────────────────────────────────
  test:
    name: Tests + Dependency Audit
    runs-on: ubuntu-latest
    needs: [lint, gitleaks]  # block on lint + secret scan
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/shared/requirements.txt
            app/users-service/requirements.txt
            app/products-service/requirements.txt
            app/orders-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install pytest httpx pip-audit
          pip install -e app/shared/
          for svc in users-service products-service orders-service; do
            pip install -r app/$svc/requirements.txt
          done

      - name: Dependency audit (pip-audit) — fails on known-vulnerable pinned deps
        run: pip-audit -r app/shared/requirements.txt -r app/users-service/requirements.txt -r app/products-service/requirements.txt -r app/orders-service/requirements.txt --strict

      - name: Verify shared package imports
        run: |
          python -c "from shared.vault_client import get_secret; from shared.log_config import setup_logging; from shared.config import AppConfig; print('shared imports ok')"

      - name: Run unit tests (FastAPI TestClient + dev-environment fallbacks)
        run: |
          ENVIRONMENT=dev LOG_FORMAT=plain VAULT_ADDR="" pytest -q tests/ -v
          # Real import test for each service — fails the job if an import path is broken.
          for svc in users-service products-service orders-service; do
            echo "Import $svc..."
            (cd app/$svc && PYTHONPATH=../shared:. ENVIRONMENT=dev python -c "import main")
          done

      - name: Validate Dockerfiles build (context = app/, not per-service)
        run: |
          for svc in users-service products-service orders-service; do
            echo "Building test image for $svc..."
            docker build -t $svc:test -f app/$svc/Dockerfile app/
          done

      - name: Upload build logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: /tmp/*.log
          retention-days: 7

  # ──────────────────────────────────────────────
  # Step 5: Build & Push Docker images (matrix)
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # independent services should not cancel each other
      matrix:
        service: [users-service, products-service, orders-service]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels, NO mutable :latest by default)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=commit-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push (digest-pinned output via metadata)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: app/  # context is app/ so shared/ is visible — see app/*/Dockerfile.
          file: app/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output image digest (immutable — used by trivy-scan to avoid :latest race)
        id: image
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${DIGEST}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Built: $IMAGE"

    outputs:
      image: "${{ steps.image.outputs.image }}"

  # ──────────────────────────────────────────────
  # Step 6: Trivy — Container scan at pinned DIGEST (no :latest race)
  # ──────────────────────────────────────────────
  trivy-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write  # for SARIF upload
      actions: read  # for codeql upload-sarif telemetry
    strategy:
      fail-fast: false
      matrix:
        service: [users-service, products-service, orders-service]
    steps:
      - uses: actions/checkout@v5

      - name: Resolve built image at digest (P1 fix — no :latest race)
        id: resolve
        run: |
          case "${{ matrix.service }}" in
            users-service)    IMAGE="${{ needs.build.outputs.users-image }}" ;;
            products-service) IMAGE="${{ needs.build.outputs.products-image }}" ;;
            orders-service)   IMAGE="${{ needs.build.outputs.orders-image }}" ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (trivy container doesn't inherit host docker creds)
        run: docker pull ${{ steps.resolve.outputs.image }}

      - name: Trivy SARIF (non-blocking — always runs first so file exists)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Trivy vulnerability scan — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # informational upload to GitHub Security tab
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      - name: Trivy SBOM generation
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: spdx-json
          output: sbom-${{ matrix.service }}.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 30
        if: always()

  # ──────────────────────────────────────────────
  # Step 7: Terraform validation (matrix of versions for compat)
  # ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate (v${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint, gitleaks]
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 1.5.* — required_version ~> 1.5 in backend.tf. 1.6.x violates.
        version: ["1.5.7"]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}

      - name: Terraform Init (no backend — local dev path)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  # ──────────────────────────────────────────────
  # Step 8: Deploy — opt-in via `workflow_dispatch` only.
  # Not auto-running on push. Requires manual approval + protected
  # `production` environment in repo settings for any real promotion.
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy (manual)
    runs-on: ubuntu-latest
    needs: [trivy-scan, terraform-validate]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          chmod +x /tmp/kustomize
          /tmp/kustomize version

      - name: Pin image digests in kustomization (audit-grade — no mutable :latest)
        run: |
          cd k8s/apps
          # Single output `image` per matrix row. All 3 services build per row.
          # Use the build output roll-in: pick the per-service digest from the
          # same matrix via ${{ needs.build.outputs[matrix.service] }} pattern
          # (not supported in workflow_call; default to images produced by build-test matrix).
          for digest in "${{ needs.build.outputs.image }}"; do
            if [[ -z "$digest" ]]; then
              echo "::warning::build.outputs.image empty — using safer :latest detection (should not happen with new output naming)"
              exit 1
            fi
            /tmp/kustomize edit set image "users-service=$digest"
            /tmp/kustomize edit set image "products-service=$digest"
            /tmp/kustomize edit set image "orders-service=$digest"
          done
          cd "$GITHUB_WORKSPACE"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Validate rendered manifests before apply
        run: |
          /tmp/kustomize build k8s/apps/ | kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json'
          echo "Manifests validated — proceeding with rollout"

      - name: Deploy manifests (server-side apply via kustomize)
        id: deploy
        run: |
          kubectl apply -f k8s/vault/manifests.yaml --server-side
          /tmp/kustomize build k8s/apps/ | kubectl apply --server-side -f -
          /tmp/kustomize build k8s/apps/ > /tmp/rendered-manifests.yaml
          kubectl rollout status deploy/vault -n vault --timeout=120s
          kubectl rollout status deploy/users-service -n devops-platform --timeout=120s
          kubectl rollout status deploy/products-service -n devops-platform --timeout=120s
          kubectl rollout status deploy/orders-service -n devops-platform --timeout=120s

      - name: Metrics smoke-test — /metrics returns Histogram
        run: |
          kubectl run metrics-check --image=curlimages/curl:8.8.0 --restart=Never -- /bin/sh -c 'for svc in users-service products-service orders-service; do echo "Check $svc..."; curl -sf http://$svc.devops-platform.svc.cluster.local:80/metrics | grep -q http_request_duration_seconds_bucket || { echo "FAIL: $svc missing histogram"; exit 1; }; done; echo "All /metrics OK";'
          kubectl wait --for=condition=Complete pod/metrics-check --timeout=60s 2>/dev/null
          kubectl logs pod/metrics-check
          kubectl delete pod metrics-check --ignore-not-found
          echo "url=https://devops-platform.local" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Step 9: Nightly load test (k6) — triggered by schedule only.
  # ──────────────────────────────────────────────
  load-test:
    name: Load test (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/load-test.js
          flags: --out json=/tmp/k6-results.json
        env:
          BASE_URL: ${{ vars.K6_BASE_URL || 'http://users-service.devops-platform.svc.cluster.local:80' }}

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: /tmp/k6-results.json
          retention-days: 14
