name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, clean-main, secondary]
    # app/**/service.yaml markers are rewritten by the tag-backfill job after
    # every successful build (and hand-edited tags deploy directly via
    # ArgoCD's ApplicationSet) — a marker-only push must NOT re-trigger CI,
    # or every build would spawn a second full pipeline run.
    paths-ignore:
      - "app/**/service.yaml"
  pull_request:
    branches: [main, develop, secondary]
  workflow_dispatch:
  schedule:
    # Nightly drift detection — catches new vulnerabilities in dependencies.
    - cron: "0 3 * * *"

# Default least-privilege — every job that needs more must declare it.
permissions:
  contents: read

# Concurrent runs on the same ref cancel each other — avoids matrix racing
# on the same registry tag (:latest), saving compute (devops-analysis-report.md P1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.5.7"
  HELM_VERSION: "v3.14.4"

jobs:
  # ──────────────────────────────────────────────
  # Discovery — the ONLY source of truth for "which services exist".
  # Anything under app/ containing a main.py is a service (shared/ is
  # excluded automatically). No registry file, no hardcoded names: add/
  # remove/rename a dir and every job adapts. Images are built from the
  # ONE generic app/Dockerfile with SERVICE_NAME=<dir>.
  # ──────────────────────────────────────────────
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.svc.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      - id: svc
        run: |
          SERVICES=""
          for d in app/*/; do
            d=${d%/}
            if [ -f "$d/main.py" ]; then
              SERVICES="$SERVICES ${d#app/}"
            fi
          done
          for d in app/*/*/; do
            if [ -f "$d/main.py" ]; then
              SERVICES="$SERVICES $(basename "$(dirname "$d")")/$(basename "$d")"
            fi
          done
          # emit [{name, path}]: name = k8s/image name (flat or <app>-<svc>),
          # path = dir relative to app/ (Dockerfile COPY + lint/pip/import).
          echo "services=$(printf '%s\n' $SERVICES | jq -cnR '[inputs | select(length > 0) | {name: gsub("/"; "-"), path: .}]')" >> "$GITHUB_OUTPUT"
          echo "Discovered: $(printf '%s\n' $SERVICES | jq -cR '[inputs | select(length > 0)]')"

  # ──────────────────────────────────────────────
  # Step 1: Lint (FastAPI microservices + TF + YAML + manifests)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: discover
    env:
      SERVICES: ${{ needs.discover.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/shared/requirements.txt
            app/*/requirements.txt

      - name: Install pinned linters
        run: pip install ruff==0.1.9 yamllint==1.33.0

      - name: Ruff lint all microservices + shared lib
        run: |
          ruff check app/shared/
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            svc=$(echo "$item" | jq -r .name)
            PATH_REL=$(echo "$item" | jq -r .path)
            echo "Linting $svc (app/$PATH_REL)..."
            ruff check "app/$PATH_REL/"
          done

      - name: Validate Terraform format
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive terraform/

      - name: Install Helm (chart validation later)
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate YAML manifests (yamllint + kubeconform + conftest + helm render)
        run: |
          # Helm chart templates are Go-template files, not raw manifests —
          # excluded from static YAML validation below.
          find k8s/ \( -name '*.yaml' -o -name '*.yml' \) ! -path '*chart/templates*' -print0 | \
            xargs -0 yamllint -d "{rules: {line-length: disable}}"
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          find k8s/ -name '*.yaml' ! -name '*values*.yaml' ! -name 'Chart.yaml' ! -name 'crds.yaml' \
            ! -name '*-patch.yaml' ! -path '*chart/templates*' -print0 | \
            xargs -0 /tmp/kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.28.0 \
              -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json'

          # Conftest — policy-as-code for manifests (audit mode).
          find k8s/ -name '*.yaml' ! -path '*chart/templates*' -print0 | \
            xargs -0 conftest test --policy k8s/policies/conftest/ 2>/dev/null || \
            echo "conftest not installed — policy-as-code in audit mode"

          # Helm chart must render for every discovered service and pass kubeconform.
          VALUES=/tmp/chart-values.yaml
          printf 'services:\n' > "$VALUES"
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            printf '  - name: %s\n' "$(echo "$item" | jq -r .name)" >> "$VALUES"
          done
          helm template ci k8s/apps/chart -f "$VALUES" > /tmp/chart-render.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/chart-render.yaml) objects for $(echo "$SERVICES" | jq 'length') services"
          /tmp/kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json' \
            /tmp/chart-render.yaml

  # ──────────────────────────────────────────────
  # Step 2: Gitleaks — Secret scanning (BLOCKING)
  # ──────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to comment on PRs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml

  # ──────────────────────────────────────────────
  # Step 3: Tests + dependency audit
  # ──────────────────────────────────────────────
  test:
    name: Tests + Dependency Audit
    runs-on: ubuntu-latest
    needs: [discover, lint, gitleaks]  # block on lint + secret scan
    env:
      SERVICES: ${{ needs.discover.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/shared/requirements.txt
            app/*/requirements.txt

      - name: Install dependencies
        run: |
          pip install pytest httpx pip-audit
          pip install -e app/shared/
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            PATH_REL=$(echo "$item" | jq -r .path)
            pip install -r "app/$PATH_REL/requirements.txt"
          done

      - name: Dependency audit (pip-audit) — fails on known-vulnerable pinned deps
        run: |
          REQS=""
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            PATH_REL=$(echo "$item" | jq -r .path)
            REQS="$REQS -r app/$PATH_REL/requirements.txt"
          done
          pip-audit -r app/shared/requirements.txt $REQS --strict

      - name: Verify shared package imports
        run: |
          python -c "from shared.vault_client import get_secret; from shared.log_config import setup_logging; from shared.config import AppConfig; print('shared imports ok')"

      - name: Run unit tests (FastAPI TestClient + dev-environment fallbacks)
        run: |
          ENVIRONMENT=dev LOG_FORMAT=plain VAULT_ADDR="" pytest -q tests/ -v
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            PATH_REL=$(echo "$item" | jq -r .path)
            echo "Import $(echo "$item" | jq -r .name) (app/$PATH_REL)..."
            (cd "app/$PATH_REL" && PYTHONPATH=../shared:. ENVIRONMENT=dev python -c "import main")
          done

      - name: Validate Dockerfiles build (generic app/Dockerfile + SERVICE_NAME build-arg)
        run: |
          for item in $(echo "$SERVICES" | jq -c '.[]'); do
            svc=$(echo "$item" | jq -r .name)
            PATH_REL=$(echo "$item" | jq -r .path)
            echo "Building test image for $svc..."
            docker build -t $svc:test -f app/Dockerfile --build-arg SERVICE_NAME=$PATH_REL app/
          done

      - name: Upload build logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: /tmp/*.log
          retention-days: 7

  # ──────────────────────────────────────────────
  # Step 4: Build & Push Docker images (dynamic matrix)
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [discover, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # independent services should not cancel each other
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels, NO mutable :latest by default)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=commit-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push (generic Dockerfile, SERVICE_NAME build-arg)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: app/  # context is app/ so shared/ is visible — see app/Dockerfile.
          file: app/Dockerfile
          build-args: |
            SERVICE_NAME=${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Record immutable tag for deploy (commit-<sha>, built by metadata above)
        id: tag
        run: |
          echo "tag=commit-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

    # Matrix rows produce per-service artifacts (sbom/sarif names carry
    # ${{ matrix.service }}). Deploy re-derives the immutable commit tag
    # instead of plumbing digests across matrix outputs.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # ──────────────────────────────────────────────
  # Step 4b: GitOps tag write-back — make rollouts diff-visible.
  # Build produced immutable commit-<sha7> images; ArgoCD's ApplicationSet
  # reads the image tag from app/<svc>/service.yaml, so write the tag back
  # into every marker and push. ArgoCD then sees a real git diff and rolls
  # out. Idempotent: no marker change → no push (and marker-only pushes are
  # filtered out of the push trigger above, so this never re-triggers CI).
  # ──────────────────────────────────────────────
  tag-backfill:
    name: Write build tag into service.yaml
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update service.yaml markers with the immutable commit tag
        run: |
          TAG="commit-${GITHUB_SHA:0:7}"
          echo "Pinning markers to $TAG"
          for f in app/*/service.yaml app/*/*/service.yaml; do
            [ -f "$f" ] || continue
            if grep -q '^tag:' "$f"; then
              sed -i "s|^tag:.*|tag: $TAG|" "$f"
            else
              printf 'tag: %s\n' "$TAG" >> "$f"
            fi
            echo "  $f -> $TAG"
          done

      - name: Commit and push marker update
        run: |
          if git diff --quiet app/; then
            echo "markers already pinned — nothing to push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/
            git commit -m "ci: pin service images to commit-${GITHUB_SHA:0:7}"
            git push
          fi

  # ──────────────────────────────────────────────
  # Step 5: Trivy — Container scan at pinned DIGEST (no :latest race)
  # ──────────────────────────────────────────────
  trivy-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [discover, build]
    permissions:
      contents: read
      packages: read
      security-events: write  # for SARIF upload
      actions: read  # for codeql upload-sarif telemetry
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve built image
        id: resolve
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:commit-${GITHUB_SHA:0:7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Scanning target image: $IMAGE"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (trivy container doesn't inherit host docker creds)
        run: docker pull ${{ steps.resolve.outputs.image }}

      - name: Trivy SARIF (non-blocking — always runs first so file exists)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          ignore-unfixed: true

      - name: Trivy vulnerability scan — fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # informational upload to GitHub Security tab
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

      - name: Trivy SBOM generation
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          format: spdx-json
          output: sbom-${{ matrix.service.name }}.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.json
          retention-days: 30
        if: always()

  # ──────────────────────────────────────────────
  # Step 6: Terraform validation (matrix of versions for compat)
  # ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate (v${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint, gitleaks]
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 1.5.* — required_version ~> 1.5 in backend.tf. 1.6.x violates.
        version: ["1.5.7"]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}

      - name: Terraform Init (no backend — local dev path)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  # ──────────────────────────────────────────────
  # Step 7: Deploy — opt-in via `workflow_dispatch` only.
  # Discovery-driven: renders ONE helm chart with the discovered services +
  # their build digests. No service name appears in the workflow.
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy (manual)
    runs-on: ubuntu-latest
    needs: [discover, build, trivy-scan, terraform-validate]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      packages: read
    env:
      SERVICES: ${{ needs.discover.outputs.services }}
      COMMIT_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install kubeconform (render validation)
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Build discovered values file (services + immutable commit tags)
        run: |
          VALUES=values.generated.yaml
          printf 'services:\n' > "$VALUES"
          for svc in $(echo "$SERVICES" | jq -r '.[].name'); do
            printf '  - name: %s\n    tag: %s\n' "$svc" "$COMMIT_TAG" >> "$VALUES"
          done
          echo "Generated values for $(echo "$SERVICES" | jq 'length') services"
          cat "$VALUES"

      - name: Render and validate manifests
        run: |
          /tmp/kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/{{.ResourceKind}}.json' \
            < <(helm template apps k8s/apps/chart -f values.generated.yaml)
          echo "Manifests validated — proceeding with rollout"

      - name: Sync service list to Vault namespace (for vault-setup provisioning)
        run: |
          kubectl create configmap devops-service-list -n vault \
            --from-literal=services="$(echo "$SERVICES" | jq -r '.[].name' | tr '\n' ' ')" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy (server-side apply via helm template)
        id: deploy
        run: |
          kubectl apply -f k8s/vault/manifests.yaml --server-side
          helm template apps k8s/apps/chart -f values.generated.yaml | kubectl apply --server-side -f -
          kubectl rollout status deploy/vault -n vault --timeout=120s
          for svc in $(echo "$SERVICES" | jq -r '.[].name'); do
            kubectl rollout status deploy/$svc -n devops-platform --timeout=120s
          done

      - name: Metrics smoke-test — /metrics returns Histogram (all discovered services)
        run: |
          LIST="$(echo "$SERVICES" | jq -r '.[].name' | tr '\n' ' ')"
          SCRIPT="for svc in $LIST; do echo \"Check \$svc...\"; curl -sf http://\$svc.devops-platform.svc.cluster.local:80/metrics | grep -q http_request_duration_seconds_bucket || exit 1; done; echo \"All /metrics OK\""
          kubectl run metrics-check --image=curlimages/curl:8.8.0 --restart=Never -- /bin/sh -c "$SCRIPT"
          kubectl wait --for=condition=Complete pod/metrics-check --timeout=60s 2>/dev/null
          kubectl logs pod/metrics-check
          kubectl delete pod metrics-check --ignore-not-found
          echo "url=https://devops-platform.local" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Step 8: Nightly load test (k6) — triggered by schedule only.
  # ──────────────────────────────────────────────
  load-test:
    name: Load test (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      # Load test targets are discovered/declared via the K6_BASE_URL repo
      # variable — no service name is hardcoded here.
      - name: Skip load test (K6_BASE_URL not configured)
        if: vars.K6_BASE_URL == ''
        run: echo "::warning::K6_BASE_URL repo variable not set — skipping nightly load test"

      - name: Run k6 load test
        if: vars.K6_BASE_URL != ''
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/load-test.js
          flags: --out json=/tmp/k6-results.json
        env:
          BASE_URL: ${{ vars.K6_BASE_URL }}

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: /tmp/k6-results.json
          retention-days: 14