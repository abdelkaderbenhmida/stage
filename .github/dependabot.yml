# Dependabot keeps dependencies updated across the platform.
# P2 fix — was missing entirely before (devops-analysis-report.md).

version: 2
updates:
  # Python services — weekly cadence, batched PRs.
  - package-ecosystem: pip
    directory: /app/users-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fastapi-stack:
        patterns: ["fastapi", "uvicorn", "pydantic*"]
      observability:
        patterns: ["prometheus-client", "python-json-logger"]
    reviewers: ["abdelkaderbenhmilda"]
    labels: ["dependencies", "users-service"]

  - package-ecosystem: pip
    directory: /app/products-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "products-service"]

  - package-ecosystem: pip
    directory: /app/orders-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "orders-service"]

  - package-ecosystem: pip
    directory: /app/shared
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "shared"]

  # GitHub Actions versions — monthly, security-only priority.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # Docker base images (python:3.11-slim referenced via ARG).
  - package-ecosystem: docker
    directory: /app/users-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker", "users-service"]
  - package-ecosystem: docker
    directory: /app/products-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker", "products-service"]
  - package-ecosystem: docker
    directory: /app/orders-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker", "orders-service"]
