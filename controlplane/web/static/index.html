<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Central Platform</title>
  <!-- shell.css owns the palette and the reset; the other two are each scoped
       to the subtree they style (#cp-root / #platform-root) and must load
       after it. -->
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/platform/style.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234cc2ff'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='monospace' font-weight='bold'>D</text></svg>">
</head>
<body>
  <div id="app" class="boot">Loading…</div>

  <div id="platform-root" hidden>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">D</div>
          <div>
            <div class="t1">Central Platform</div>
            <div class="t2">Control Tower</div>
          </div>
        </div>

        <div class="nav-group">Workspace</div>
        <div class="nav-item" data-nav="projects" data-href="#/projects"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Projects</div>
        <div class="nav-item" data-nav="catalogue" data-href="#/catalogue"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> Catalogue</div>
        <div class="nav-item" data-nav="security" data-href="#/security"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span> Security</div>
        <div class="nav-item" data-nav="teams" data-href="#/teams"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Teams</div>
        <div class="nav-item" data-nav="jobs" data-href="#/jobs"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Jobs</div>

        <!-- Operator console: hidden unless the signed-in user is a platform
             admin. Every route behind it is gated server-side regardless. -->
        <div class="nav-group" data-operator hidden>Operations <span class="nav-tag">admin</span></div>
        <div class="nav-item" data-operator hidden data-view="topology"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span> Platform Health</div>
        <div class="nav-item" data-operator hidden data-view="apps"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Apps &amp; Services
          <span class="badge" id="nav-apps">0</span>
        </div>
        <div class="nav-item" data-operator hidden data-view="overview"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Overview</div>
        <div class="nav-item" data-operator hidden data-view="services"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg></span> Services
          <span class="badge" id="nav-services">0</span>
        </div>
        <div class="nav-item" data-operator hidden data-view="config"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Operations</div>

        <div class="spacer"></div>
        <div class="sidebar-footer">
          <label class="small muted" style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" id="autorefresh" checked> live updates
          </label>
          <span class="who" id="whoami"></span>
          <button id="logout" type="button">Log out</button>
        </div>
      </aside>

      <main class="content">
        <!-- Operator chrome: the platform's own git revision and uptime.
             Only platform/app.js can fill it, and only an admin may load
             that data, so it starts hidden and renderTopbar() reveals it.
             Rendering it unconditionally left every non-admin staring at a
             permanent ": loading…" badge for data they can never receive. -->
        <div class="topbar" hidden>
          <span class="status-dot ok pulse" id="top-status"></span>
          <span class="repo-badge"><span>:</span><span id="top-repo">loading…</span></span>
          <span class="muted small" id="top-updated"></span>
        </div>

        <!-- Control-plane half. Its own stylesheet is scoped to #cp-root. -->
        <section class="view" id="view-cp">
          <div id="cp-root">
            <main id="view"></main>
            <!-- Inside #cp-root so the scoped `.toast` rules reach it; it is
                 position:fixed, so nesting does not affect where it lands. -->
            <div id="toast" class="toast" hidden aria-live="polite"></div>
          </div>
        </section>

        <!-- Platform-ops half. -->
        <section class="view active" id="view-topology"></section>
        <section class="view" id="view-apps"></section>
        <section class="view" id="view-overview"></section>
        <section class="view" id="view-services"></section>
        <section class="view" id="view-config"></section>
      </main>
    </div>

    <div class="toast" id="platform-toast"></div>
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <span id="detail-title"></span>
        <button class="detail-close" data-act="closeDetail">✕</button>
      </div>
      <div class="detail-content" id="detail-content"></div>
    </div>
    <div class="detail-overlay" id="detail-overlay" data-act="closeDetail"></div>
  </div>

  <script src="/static/graph.js"></script>
  <script src="/static/platform/app.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
