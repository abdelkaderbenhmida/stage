---
# Defaults for `k8s_master` — kubeadm init + Calico installation.
calico_version: "v3.26.1"
tigera_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
calico_cr_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"
# Where to save the generated worker join command — P2: 0600 (was 0644 plaintext).
kubeadm_join_sh: /tmp/kubeadm-join.sh
kubeadm_join_txt: /tmp/kubeadm-join.txt
kubeadm_join_mode: "0600"
