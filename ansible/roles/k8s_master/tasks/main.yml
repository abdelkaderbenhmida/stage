---
- name: Run kubeadm init on master
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ ansible_host }}
      --pod-network-cidr={{ pod_cidr }}
      --service-cidr={{ service_cidr }}
      --cri-socket={{ cri_endpoint }}
      --upload-certs
      --skip-phases=addon/coredns,addon/kube-proxy
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init_result
  tags: master

- name: Create .kube directory for devops user
  ansible.builtin.file:
    path: /home/devops/.kube
    state: directory
    mode: "0755"
    owner: devops
    group: devops
  tags: master

- name: Copy admin kubeconfig to devops user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/devops/.kube/config
    owner: devops
    group: devops
    mode: "0600"
    remote_src: true
  tags: master

- name: Wait for API server to start responding
  ansible.builtin.command:
    cmd: kubectl version --request-timeout=5s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: api_ready
  retries: 24
  delay: 5
  until: api_ready.rc == 0
  tags: master

- name: Install kube-proxy and coredns addons (skipped during kubeadm init)
  ansible.builtin.command:
    cmd: kubeadm init phase addon kube-proxy --pod-network-cidr={{ pod_cidr }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: kube_proxy
  retries: 6
  delay: 10
  until: kube_proxy.rc == 0
  tags: master

- name: Install coredns addon
  ansible.builtin.command:
    cmd: kubeadm init phase addon coredns
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: coredns_addon
  retries: 6
  delay: 10
  until: coredns_addon.rc == 0
  tags: master

- name: Download Calico Tigera operator manifest
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
    dest: /tmp/tigera-operator.yaml
    mode: "0644"
  tags: master

- name: Install Calico Tigera operator (server-side apply to avoid annotation limit)
  ansible.builtin.command:
    cmd: kubectl apply --server-side --force-conflicts -f /tmp/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: calico_install
  retries: 6
  delay: 10
  until: calico_install.rc == 0
  tags: master

- name: Wait for Tigera operator to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Available deployment/tigera-operator -n tigera-operator --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: tigera_wait
  retries: 12
  delay: 10
  until: tigera_wait.rc == 0
  ignore_errors: true
  tags: master

- name: Install Calico custom resources
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: calico_cr
  retries: 6
  delay: 10
  until: calico_cr.rc == 0
  tags: master

- name: Wait for Calico nodes to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready nodes --all --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: calico_wait
  retries: 3
  delay: 10
  until: calico_wait.rc == 0
  ignore_errors: true
  tags: master

- name: Generate kubeadm join command for workers
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubeadm_join_command
  changed_when: false
  retries: 6
  delay: 10
  until: kubeadm_join_command.rc == 0
  tags: master

- name: Save join command as fact for worker nodes
  ansible.builtin.set_fact:
    join_command: "{{ kubeadm_join_command.stdout }}"
  tags: master

- name: Store join command on master host for workers to fetch
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ kubeadm_join_command.stdout }}
    dest: /tmp/kubeadm-join.sh
    mode: "0700"
  tags: master

- name: Store join command text for workers to read
  ansible.builtin.copy:
    content: "{{ kubeadm_join_command.stdout }}"
    dest: /tmp/kubeadm-join.txt
    mode: "0644"
  tags: master