---
- name: Disable swap
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false
  tags: k8s

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(.*\s+swap\s+.*)$'
    replace: '# \1'
  tags: k8s

- name: Create kernel modules load directory
  ansible.builtin.file:
    path: /etc/modules-load.d
    state: directory
    mode: "0755"
  tags: k8s

- name: Load kernel modules overlay and br_netfilter
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: k8s

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  tags: k8s

- name: Set Kubernetes sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"
  tags: k8s

- name: Apply sysctl parameters
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  tags: k8s

- name: Install prerequisites for Kubernetes apt repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
    state: present
    update_cache: true
  tags: k8s

- name: Create keyring directory for Kubernetes GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: k8s

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
    dest: /tmp/k8s-release.key
    mode: "0644"
  tags: k8s

- name: Dearmor and install Kubernetes GPG key
  ansible.builtin.shell:
    cmd: gpg --dearmor --batch --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-release.key
    executable: /bin/bash
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tags: k8s

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    state: present
    update_cache: true
  tags: k8s

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet={{ k8s_version_deb }}
      - kubeadm={{ k8s_version_deb }}
      - kubectl={{ k8s_version_deb }}
    state: present
    update_cache: true
    allow_downgrade: true
  tags: k8s

- name: Hold Kubernetes packages to prevent auto-upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  tags: k8s

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true
  tags: k8s
