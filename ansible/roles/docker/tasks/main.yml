---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  tags: docker

- name: Create keyring directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: docker

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg
    mode: "0644"
  tags: docker

- name: Dearmor and install Docker GPG key
  ansible.builtin.shell:
    cmd: gpg --dearmor --batch --yes -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
    executable: /bin/bash
  args:
    creates: /etc/apt/keyrings/docker.gpg
  tags: docker

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: true
  tags: docker

- name: Install Docker CE + containerd
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  tags: docker

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
  tags: docker

- name: Add devops user to docker group
  ansible.builtin.user:
    name: devops
    groups: docker
    append: true
  tags: docker

- name: Generate default containerd config
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_default_config
  changed_when: false
  tags: docker

- name: Write containerd default config to file
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout }}"
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd
  tags: docker

- name: Set SystemdCgroup true in containerd config
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s+SystemdCgroup\s*='
    line: '            SystemdCgroup = true'
  notify: Restart containerd
  tags: docker

- name: Ensure containerd is enabled and started
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
  tags: docker
