---
- name: Wait for nodes to accept SSH connections
  # terraform apply returning only means libvirt started the domain, not
  # that the guest finished booting — cloud-init still has to create the
  # user and install the SSH key. wait_for_connection blocks here instead
  # of racing straight into the docker/k8s roles below.
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 240
        sleep: 5

- name: Apply Docker and containerd on all nodes
  hosts: all
  become: true
  roles:
    - docker
  tags:
    - docker

- name: Apply Kubernetes common prerequisites on all nodes
  hosts: all
  become: true
  roles:
    - k8s_common
  tags:
    - k8s

- name: Bootstrap Kubernetes master
  hosts: masters
  become: true
  roles:
    - k8s_master
  tags:
    - master

- name: Join Kubernetes workers to cluster
  hosts: workers
  become: true
  serial: 1
  roles:
    - k8s_worker
  tags:
    - worker

- name: Reset Kubernetes cluster — OPT-IN
  # devops-analysis-report.md P2: the reset play was guarded only by a tag,
  # so a careless `ansible-playbook playbook.yml` would wipe the cluster.
  # Now it requires BOTH an explicit tag (--tags reset) AND
  # `-e reset_confirmed=true` on the command line.
  hosts: all
  become: true
  roles:
    - role: k8s_reset
      when: reset_confirmed | default(false) | bool
  tags:
    - reset
    - never
