[defaults]
inventory = inventory.ini
host_key_checking = False    # disposable VMs in homelab; tighten for prod.
remote_user = devops
private_key_file = ~/.ssh/id_ed25519
roles_path = roles
timeout = 30
forks = 10                   # P2: was missing default of 5
retry_files_enabled = False
pipelining = True            # P2: removed duplicate at L13.
stdout_callback = yaml       # readable output
callbacks_enabled = ansible.builtin.timer
# Vault integration path — set up when first secrets are encrypted.
# vault_password_file = ~/.ansible/vault-pass
gathering = smart

[ssh_connection]
pipelining = True
