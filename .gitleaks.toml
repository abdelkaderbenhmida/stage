# Gitleaks configuration file
# https://github.com/gitleaks/gitleaks
#
# P2 hardening: the old allowlist was too permissive (`.*\.md$` masked every
# markdown file — could hide secrets in docs; `changeme` regex masked the
# actual `change-me` token string in the repo). Tightened to only whitelist
# what is genuinely not a secret.

[extend]
# Use the default rules from gitleaks
useDefault = true

[allowlist]
description = "Project-specific allowlist — minimum surface, no broad patterns"
paths = [
    # Terraform state files: would otherwise needlessly flag auto-generated
    # strings. **IMPORTANT**: terraform.tfstate must remain gitignored
    # (see repo .gitignore) — this is defense-in-depth, not a free pass.
    '''terraform\.tfstate''',
    # The Gitleaks config file itself.
    '''\.gitleaks\.toml$''',
    # Dedicated `files.md/` reference directory — its only allowed purpose is
    # storing verbatim source snippets pasted for reading. Per-file review
    # required when adding here; keep narrow.
    '''files\.md/.*\.txt$''',
]
# Allowlisted placeholder STRINGS that are not real secrets. Deliberately
# narrow — each pattern must be unlikely to appear in a leaked secret.
regexes = [
    '''REPLACE_ME_WITH_A_REAL_SECRET''',
    '''YOUR_SECRET_HERE''',
]
