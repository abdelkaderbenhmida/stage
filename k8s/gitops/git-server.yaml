# The platform's manifest repository — the git source ArgoCD reads tenant
# workloads from.
#
# What lives here: only YAML the control plane rendered itself (Deployment or
# Rollout, Service, Ingress), one directory per <project-namespace>/<service>.
# Tenant source code never reaches this repository, and neither do rendered
# Secrets — a git history keeps them forever, so the deploy path applies those
# directly and skips them here (see runners/gitops.py).
#
# Why a git server at all: ArgoCD can only sync from git, helm or OCI. There is
# no "here are some manifests" source. Tenant repositories are external and
# often private, and the platform deliberately stores no tenant code, so the
# manifests it renders need a home of their own.
#
# Why Gitea and not `git daemon`: the git:// protocol has no authentication at
# all. The earlier version of this file relied on a NetworkPolicy alone, which
# does not restrain the NodePort the control-plane worker has to push through —
# a podSelector rule does not match traffic arriving at a node. Anyone able to
# reach that port could read and write every tenant's rendered manifests.
# Gitea speaks authenticated HTTP, which both the worker and ArgoCD support.
#
# TWO ADDRESSES, one repository, for exactly the reason the image registry has
# two (see REGISTRY / REGISTRY_INTERNAL in the README):
#   - ArgoCD runs *in* the cluster: http://git-server.gitops.svc.cluster.local:3000/...
#   - the worker pushes from a sandbox container on the host's docker network,
#     which cannot route to a ClusterIP: http://<node>:30300/...
# GITOPS_REPO_URL is the worker's address, GITOPS_REPO_URL_INTERNAL ArgoCD's.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops
  labels:
    app.kubernetes.io/name: gitops
    app.kubernetes.io/part-of: devops-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server-data
  namespace: gitops
  labels:
    app.kubernetes.io/name: git-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# The Secrets this stack needs are deliberately NOT declared in this file.
#
# `git-server-admin` (gitops namespace) and `git-server-repo` (argocd
# namespace) hold the same credential — the account the control-plane worker
# pushes with and ArgoCD reads with. Committing them with a placeholder does
# not work under GitOps: this directory is an ArgoCD Application with
# selfHeal, so a rotated password is reverted to the placeholder within
# minutes and every install ends up sharing one credential that is public in
# git. The same mistake shipped a permanently-401 Logstash for days.
#
# Create both before the first deploy, from one generated value:
#
#   PW="$(openssl rand -base64 24)"
#   kubectl -n gitops create secret generic git-server-admin \
#     --from-literal=username=controlplane --from-literal=password="$PW"
#   kubectl -n argocd create secret generic git-server-repo \
#     --from-literal=type=git \
#     --from-literal=url=http://git-server.gitops.svc.cluster.local:3000/controlplane/tenants.git \
#     --from-literal=username=controlplane --from-literal=password="$PW"
#   kubectl -n argocd label secret git-server-repo \
#     argocd.argoproj.io/secret-type=repository
#
# The same $PW goes into GITOPS_USERNAME / GITOPS_PASSWORD for the worker.
# Every object below references these with a required secretKeyRef, so a
# missing Secret fails loudly instead of starting with no credential.
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: gitops
  labels:
    app.kubernetes.io/name: git-server
spec:
  # NodePort, not ClusterIP: the writer is the control-plane worker's sandbox
  # container, which runs on the host's docker network and has no route to a
  # ClusterIP. Readers (ArgoCD) still use the in-cluster DNS name. Unlike the
  # git:// version this port is authenticated, so exposing it costs a password
  # rather than the whole repository.
  type: NodePort
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: gitops
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 1
  # One volume, one writer. A second pod rolling alongside the first would
  # have two servers writing the same refs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: devops-platform
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Creates the first admin account.
        #
        # It has to be the CLI, and it has to be here. Gitea's
        # POST /api/v1/admin/users requires authenticating as an existing
        # admin, so it cannot create the *first* one — a bootstrap Job calling
        # it gets "user does not exist" and the repository is never created.
        # `gitea admin user create` needs no auth but does need the data
        # volume, which only this pod has.
        #
        # Idempotent: on every restart after the first the account exists and
        # the command fails, which is the expected path, not an error.
        - name: create-admin
          image: gitea/gitea:1.22.6-rootless
          env:
            - name: GITEA_WORK_DIR
              value: /var/lib/gitea
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-server-admin
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-server-admin
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CONF=/var/lib/gitea/custom/conf/app.ini

              # Gitea only writes app.ini on its first web start, and the CLI
              # refuses to run without one ("Unable to load config file for an
              # installed Gitea instance"). Writing it here is what lets the
              # account exist BEFORE the server first serves a request — the
              # order the bootstrap Job depends on.
              #
              # Configuration lives in this file rather than in GITEA__*
              # environment variables so that the CLI and the server read the
              # same settings; env vars only reach the server process.
              if [ ! -f "$CONF" ]; then
                mkdir -p "$(dirname "$CONF")" /var/lib/gitea/data
                cat > "$CONF" <<INI
              APP_NAME = platform manifests
              RUN_MODE = prod
              WORK_PATH = /var/lib/gitea

              [server]
              HTTP_PORT = 3000
              ROOT_URL  = http://git-server.gitops.svc.cluster.local:3000/

              [database]
              DB_TYPE = sqlite3
              PATH    = /var/lib/gitea/data/gitea.db

              [repository]
              ROOT            = /var/lib/gitea/data/repositories
              DEFAULT_PRIVATE = private

              [security]
              INSTALL_LOCK = true
              SECRET_KEY   = ${GIT_PASSWORD}

              [service]
              DISABLE_REGISTRATION = true
              REQUIRE_SIGNIN_VIEW  = true

              [actions]
              ENABLED = false
              INI
              fi

              # Creates the schema. Without it `admin user create` has no
              # tables to write into.
              gitea --config "$CONF" migrate

              # Create, or bring the password back in line with the Secret.
              #
              # `admin user create` alone is not enough: it fails once the
              # account exists, so rotating the Secret left Gitea on the old
              # password while every client used the new one — the worker's
              # push and ArgoCD's fetch both 401, and the account looks
              # correctly configured from the outside. change-password is what
              # makes the Secret authoritative.
              #
              # Output is filtered because Gitea echoes the password back.
              # Output goes to a file rather than through a pipe: piping to
              # grep makes the shell test GREP's exit status, not gitea's, so
              # the create always looked like it succeeded and the update
              # branch was never taken.
              OUT=/var/lib/gitea/.bootstrap-out
              if gitea --config "$CONF" admin user create \
                   --admin \
                   --username "$GIT_USERNAME" \
                   --password "$GIT_PASSWORD" \
                   --email controlplane@platform.local \
                   --must-change-password=false > "$OUT" 2>&1; then
                echo "admin account created"
              else
                grep -vF "$GIT_PASSWORD" "$OUT" || true
                gitea --config "$CONF" admin user change-password \
                  --username "$GIT_USERNAME" \
                  --password "$GIT_PASSWORD" \
                  --must-change-password=false > "$OUT" 2>&1 || true
                grep -vF "$GIT_PASSWORD" "$OUT" || true
                echo "admin account already existed — password synced to the Secret"
              fi
              rm -f "$OUT"
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      containers:
        - name: gitea
          image: gitea/gitea:1.22.6-rootless
          env:
            # The file the init container wrote. Same settings for the CLI and
            # the server; GITEA__* env vars would only reach this process.
            - name: GITEA_APP_INI
              value: /var/lib/gitea/custom/conf/app.ini
            - name: GITEA_WORK_DIR
              value: /var/lib/gitea
            # Skip the interactive installer: an unconfigured Gitea serves a
            # setup page instead of the git endpoints, so the first push would
            # fetch HTML and fail with a git error naming neither cause.
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              value: http://git-server.gitops.svc.cluster.local:3000/
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            # This repository is infrastructure, not a forge. Nobody signs up,
            # and an anonymous reader must not be able to enumerate tenants.
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: GITEA__repository__DEFAULT_PRIVATE
              value: "private"
            - name: GITEA__actions__ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: git-server-data
---
# Creates the admin account and the tenants repository. A Job rather than an
# init container: it must run once against a *running* Gitea (the API is only
# up after the server starts), and re-running it on every pod restart would
# reset the account the platform is actively pushing with.
apiVersion: batch/v1
kind: Job
metadata:
  name: git-server-bootstrap
  namespace: gitops
  labels:
    app.kubernetes.io/name: git-server
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: gitea/gitea:1.22.6-rootless
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-server-admin
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-server-admin
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE=http://git-server.gitops.svc.cluster.local:3000

              # The Job can start before the server is listening; retrying here
              # is cheaper than a CrashLoop that reads like a broken image.
              i=0
              until curl -sf "$BASE/api/healthz" >/dev/null; do
                i=$((i+1))
                [ "$i" -gt 60 ] && echo "gitea did not become ready" && exit 1
                sleep 5
              done

              # The admin account is created by the server pod's init
              # container, not here — the API cannot create the first admin.
              #
              # auto_init, so `main` exists. Cloning a bare repository with
              # --branch main fails with "Remote branch main not found", which
              # is what every deploy would hit on a fresh install.
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/api/v1/user/repos" \
                -H 'Content-Type: application/json' \
                -u "$GIT_USERNAME:$GIT_PASSWORD" \
                -d '{"name":"tenants","private":true,"auto_init":true,"default_branch":"main"}')

              # 201 created, 409 already there. Anything else — 401 above all —
              # means the repository the whole GitOps path depends on does not
              # exist, and failing loudly beats a deploy that discovers it.
              case "$CODE" in
                201|409) echo "tenants repository present ($CODE)" ;;
                *) echo "could not create the tenants repository: HTTP $CODE"; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
