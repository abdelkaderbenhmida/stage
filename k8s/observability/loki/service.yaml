# Loki Service — ClusterIP port 3100 in monitoring ns.
# Referenced by Grafana datasource (loki.monitoring.svc.cluster.local:3100)
# and Promtail (loki.monitoring.svc.cluster.local:3100/loki/api/v1/push).
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki