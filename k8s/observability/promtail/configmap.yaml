# Promtail configuration — tails /var/log/containers/*.log,
# pushes to loki.monitoring.svc.cluster.local:3100/loki/api/v1/push.
# Pipeline parses json-logger fields (level, message, timestamp) from
# the JSON stdout that Phase 5 log_config.py emits.
# Labels: namespace, service, container — service = pod_label_app_kubernetes_io_name.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: devops-platform
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: drop
            regex: loki
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        pipeline_stages:
          - json:
              expressions:
                level: level
                message: message
                timestamp: timestamp
          - labels:
              level:
              service: