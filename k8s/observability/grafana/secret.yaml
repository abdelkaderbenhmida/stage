# Grafana admin credentials Secret.
# Admin user / password placeholders encoded base64 (admin:admin by default
# to match dev cluster). For production, replace with Vault-injected values
# per Phase 4 secret pattern - DO NOT bake secrets into git for prod.
# Decode check: echo 'YWRtaW4=' | base64 -d => admin
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-admin-credentials
    app.kubernetes.io/part-of: devops-platform
type: Opaque
data:
  admin-user: YWRtaW4=
  admin-password: YWRtaW4=
