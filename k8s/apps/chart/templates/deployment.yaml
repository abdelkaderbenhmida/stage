{{- range .Values.services }}
{{- $svc := . }}
{{- $port := $svc.port | default 8000 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    {{- include "apps-common.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $.Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        {{- include "apps-common.labels" $ | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $svc.name }}-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $svc.name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $svc.name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ $svc.name }}
          image: {{ template "apps-common.image" (dict "Values" $.Values "name" $svc.name "image" $svc.image "tag" $svc.tag) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: {{ $svc.name | quote }}
            - name: ENVIRONMENT
              value: {{ $.Values.environment | quote }}
            - name: VAULT_ADDR
              value: {{ $.Values.vault.addr | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.vault.tokenSecret }}
                  key: root-token
                  optional: false
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: {{ ($svc.resources | default $.Values.resources).requests.cpu | quote }}
              memory: {{ ($svc.resources | default $.Values.resources).requests.memory | quote }}
            limits:
              cpu: {{ ($svc.resources | default $.Values.resources).limits.cpu | quote }}
              memory: {{ ($svc.resources | default $.Values.resources).limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}