{{- if not .Values.renderSharedOnly }}
{{- range .Values.services }}
{{- $svc := . }}
{{- $port := $svc.port | default 8000 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    {{- include "apps-common.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $.Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        {{- include "apps-common.labels" $ | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $svc.name }}-sa
      # kubernetes-auth needs the SA token to present at auth/kubernetes/login;
      # automountServiceAccountToken stays false so the *application*
      # container never sees the k8s API token, only the vault-login init
      # container does, via the projected volume below.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $svc.name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $svc.name }}
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: vault-login
          image: hashicorp/vault:1.15.2
          # Per-service Vault k8s-auth role (k8s/vault/manifests.yaml), not
          # the operator's root token: this pod can only ever read the KV
          # paths that service's role grants, so a compromised pod leaks one
          # service's secrets, not every secret in Vault.
          command:
            - sh
            - -c
            - |
              set -eu
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role="{{ $svc.name }}" \
                jwt="$(cat /var/run/secrets/vault/token)")
              echo "$VAULT_TOKEN" > /vault/secrets/token
          env:
            - name: VAULT_ADDR
              value: {{ $.Values.vault.addr | quote }}
          volumeMounts:
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        # Keeps /vault/secrets/token valid.
        #
        # The init container above logs in once, and the role issues a token
        # with a 1h TTL (k8s/vault/manifests.yaml). Nothing renewed it, so
        # every pod's /readyz — which reports Vault reachability — began
        # returning 503 exactly one hour after it started, and stayed there.
        # Ten pods, all NotReady, with Vault itself perfectly healthy: the
        # token had expired, which is not the condition the probe is meant to
        # report.
        #
        # This is the job Vault Agent does. Doing it in six lines of shell
        # avoids adding the injector and its webhook to the cluster for one
        # file; if the injector is ever adopted, this sidecar and the init
        # container are what it replaces.
        - name: vault-token-refresh
          image: hashicorp/vault:1.15.2
          command:
            - sh
            - -c
            - |
              set -eu
              # Half the TTL, so a failed refresh has one more attempt before
              # anything expires.
              while true; do
                sleep 1800
                VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login                   role="{{ $svc.name }}"                   jwt="$(cat /var/run/secrets/vault/token)") || continue
                # Written then moved, so a reader never sees a partial file.
                echo "$VAULT_TOKEN" > /vault/secrets/token.new
                mv /vault/secrets/token.new /vault/secrets/token
              done
          env:
            - name: VAULT_ADDR
              value: {{ $.Values.vault.addr | quote }}
          volumeMounts:
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: {{ $svc.name }}
          image: {{ template "apps-common.image" (dict "Values" $.Values "name" $svc.name "image" $svc.image "tag" $svc.tag) }}
          # IfNotPresent is correct ONLY for immutable tags: CI writes
          # commit-<sha7> into the ApplicationSet marker after every build,
          # so a new tag always pulls fresh and a reused tag never changes.
          # A floating tag (e.g. the pre-writeback `secondary` default)
          # would keep stale images on the nodes — acceptable only as the
          # bootstrapping default before the first CI write-back.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: {{ $svc.name | quote }}
            - name: ENVIRONMENT
              value: {{ $.Values.environment | quote }}
            - name: VAULT_ADDR
              value: {{ $.Values.vault.addr | quote }}
            - name: VAULT_TOKEN_FILE
              value: /vault/secrets/token
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: {{ ($svc.resources | default $.Values.resources).requests.cpu | quote }}
              memory: {{ ($svc.resources | default $.Values.resources).requests.memory | quote }}
            limits:
              cpu: {{ ($svc.resources | default $.Values.resources).limits.cpu | quote }}
              memory: {{ ($svc.resources | default $.Values.resources).limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: vault-secrets
          emptyDir:
            medium: Memory
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  # Short-lived and scoped to Vault's own audience — this
                  # token is useless anywhere else if it leaks.
                  audience: vault
                  expirationSeconds: 600
{{- end }}
{{- end }}