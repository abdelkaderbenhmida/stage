apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-service
        app.kubernetes.io/part-of: devops-platform
        # Flagger: required to split primary vs. canary traffic.
        app.kubernetes.io/version: primary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: users-service-sa  # P1: dedicated SA, least-privilege.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000           # P1: explicit non-root UID (matches appuser in image).
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault    # P1: enforce kernel seccomp filter.
      topologySpreadConstraints:  # P1: spread replicas across nodes for HA.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: users-service
      affinity:
        podAntiAffinity:  # P1: prefer replicas on different nodes.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: users-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: users-service
          # Local image built + imported on each worker (offline dev cluster).
          # For production, replace with registry image pinned by digest.
          image: users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # P1: read-only FS guards tmp writes.
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: "users-service"
            - name: ENVIRONMENT
              value: "production"  # P0 #3: fail-fast on missing secret in prod.
            - name: VAULT_ADDR
              value: "http://vault-service.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: root-token
                  optional: false  # P0: fail-closed — refuse to start without the token.
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          startupProbe:  # P1: startup probe before liveness kicks in.
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp  # writable tmp for readOnlyRootFilesystem.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    app.kubernetes.io/name: users-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
