apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    app.kubernetes.io/name: users-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
# ServiceMonitor for users-service. Prometheus (in monitoring ns) scrapes
# the Service via its named port "http" (= port 80 -> containerPort 8000).
# Path /metrics emitted by prometheus-fastapi-instrumentator.
# Created in monitoring ns so Prometheus Operator picks it up; namespaceSelector
# points at devops-platform where the Service actually lives.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: users-service
  namespace: monitoring
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: users-service
  namespaceSelector:
    matchNames:
      - devops-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
