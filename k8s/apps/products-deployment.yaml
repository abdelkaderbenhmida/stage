apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      serviceAccountName: devops-platform-sa
      securityContext:
        runAsNonRoot: true
      containers:
      - name: products-service
        image: products-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: SERVICE_NAME
          value: "products-service"
        - name: VAULT_ADDR
          value: "http://vault-service.vault.svc.cluster.local:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-root-token
              key: root-token
              optional: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: devops-platform
spec:
  selector:
    app: products-service
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP