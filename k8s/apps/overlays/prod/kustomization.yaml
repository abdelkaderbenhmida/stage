apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay — digest-pinned images (immutable), 3 replicas for HA,
# strict network policies + anti-affinity enforced.

namespace: production
resources:
  - ../../base
  # Les Deployments/Services de chaque microservice vivent dans
  # k8s/apps/<service>/, pas dans base/ : sans ces trois lignes, les
  # patches de repliques ci-dessous ciblent des ressources absentes du
  # graphe et Kustomize les ignore silencieusement (aucune erreur).
  - ../../users
  - ../../products
  - ../../orders

# Production overrides: stricter PDB + replicas.
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels/environment
        value: production
  - target:
      kind: Deployment
      name: users-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: PodDisruptionBudget
      name: users-service-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: Deployment
      name: products-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: orders-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: PodDisruptionBudget
      name: products-service-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: orders-service-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2

images:
  - name: users-service
    newTag: digest-staging
  - name: products-service
    newTag: digest-staging
  - name: orders-service
    newTag: digest-staging
