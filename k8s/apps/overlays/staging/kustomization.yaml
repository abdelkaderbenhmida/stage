apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — pre-production. 2 replicas, full HPA, JSON logs.
# Image tag placeholder `digest-staging` is replaced by the CD pipeline
# with the digest produced by the CI build job.

namespace: staging
resources:
  - ../../base
  # Les Deployments/Services de chaque microservice vivent dans
  # k8s/apps/<service>/, pas dans base/ : sans ces trois lignes, les
  # patches de repliques ci-dessous ciblent des ressources absentes du
  # graphe et Kustomize les ignore silencieusement (aucune erreur).
  - ../../users
  - ../../products
  - ../../orders
images:
  - name: users-service
    newTag: latest
  - name: products-service
    newTag: latest
  - name: orders-service
    newTag: latest

# Le Namespace provient de la base et est renomme par le transformateur
# `namespace:` ci-dessus ; on lui ajoute seulement son etiquette d'environnement.
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels/environment
        value: staging
