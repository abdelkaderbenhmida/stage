apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — single replica, smaller resources, no HPA. Faster startup +
# lower memory footprint on a homelab dev cluster. Not safe for staging or
# production (no rolling updates with only 1 replica).

namespace: devops-platform
resources:
  - ../../base

# Dev: stay on :latest so application.yml + kubectl apply -k still work without
# a digest from CI. (CI/CD still pins digests in the prod overlay.)
images:
  - name: users-service
    newTag: latest
  - name: products-service
    newTag: latest
  - name: orders-service
    newTag: latest

# Single replica for fast iteration in dev — patch all 3 services.
patches:
  - target:
      kind: Deployment
      name: users-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: products-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: orders-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
