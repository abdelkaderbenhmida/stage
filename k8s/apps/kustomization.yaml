apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregates base app-manifests (Namespace + LimitRange + ResourceQuota +
# NetworkPolicies + PDBs + per-service SAs/Roles/RoleBindings + HPAs) and the
# three per-service subgroup kustomizations (Deployment + Service +
# ServiceMonitor each). The `images:` block pins the registry/repo per
# service; the per-service kustomizations hold the canonical newTag.
# CD pipeline substitutes a sha256 digest (see .github/workflows/ci-cd.yml —
# deploy job). Manual rollback:
#   kustomize edit set image users-service=ghcr.io/<owner>/users-service@sha256:<digest>
#   run from k8s/apps/users/ (per-service kustomization owns the tag).
resources:
  - base/
  - users/
  - products/
  - orders/
images:
  - name: users-service
    newName: ghcr.io/<owner>/users-service
    newTag: latest
  - name: products-service
    newName: ghcr.io/<owner>/products-service
    newTag: latest
  - name: orders-service
    newName: ghcr.io/<owner>/orders-service
    newTag: latest
