# ServiceMonitor for orders-service. Prometheus (in monitoring ns) scrapes
# the Service via its named port "http" (= port 80 -> containerPort 8000).
# Path /metrics emitted by prometheus-fastapi-instrumentator.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-service
  namespace: monitoring
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  namespaceSelector:
    matchNames:
      - devops-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
