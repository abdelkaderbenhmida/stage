# Grafana Helm chart values (arborescence.md Phase 6 #3-4).
#
# Chart: grafana/grafana
# Install: helm install grafana grafana/grafana -f k8s/monitoring/grafana/values.yaml -n monitoring

adminUser: admin
adminPassword: INJECT-VIA-HELM-SET-OR-SECRET-DO-NOT-COMMIT

persistence:
  enabled: true
  size: 2Gi
  storageClassName: standard

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
      # Loki datasource commented — not deployed in this stack (ELK handles logs).
      # Uncomment when loki is added to the monitoring suite.
      # - name: Loki
      #   type: loki
      #   access: proxy
      #   url: http://loki.monitoring.svc.cluster.local:3100
      #   editable: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: devops-platform
        orgId: 1
        folder: devops-platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/devops-platform

dashboards:
  # The 4 spec'd dashboards (cahier des charges §6 + Phase 5) are provisioned
  # from k8s/monitoring/grafana/dashboards/*.yaml (ConfigMaps the sidecar
  # watches via label grafana_dashboard=1).
  devops-platform:
    infra-overview:
      file: dashboards/01-infra-overview.json
    app-performance:
      file: dashboards/02-app-performance.json
    error-rate:
      file: dashboards/03-error-rate.json
    infra-detail:
      file: dashboards/04-infra-detail.json

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 3000
