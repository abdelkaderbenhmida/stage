# Grafana dashboard: Application Performance — RPS, latency P95/P99, response size.
# Data source: Prometheus. Metrics emitted by prometheus-fastapi-instrumentator (commit 5).
# Single-row heatmap, per-endpoint RPS line + latency quantiles.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-performance
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: dashboard-app-performance
    app.kubernetes.io/part-of: devops-platform
data:
  "02-app-performance.json": |
    {
      "title": "Application Performance",
      "uid": "devops-platform-app-perf",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "RPS by Endpoint",
          "type": "timeseries",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}},
          "targets": [
            {"expr": "sum by(handler)(rate(http_requests_total[5m]))", "legendFormat": "{{handler}}", "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}}
          ]
        },
        {
          "id": 2,
          "title": "P95 Latency per Endpoint",
          "type": "timeseries",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 10},
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 4}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by(le, handler)(rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{handler}} P95", "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}}
          ]
        },
        {
          "id": 3,
          "title": "P99 Latency per Endpoint",
          "type": "timeseries",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 10},
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 4}},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum by(le, handler)(rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{handler}} P99", "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}}
          ]
        },
        {
          "id": 4,
          "title": "Request duration bucket heatmap",
          "type": "timeseries",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 20},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 40}}},
          "targets": [
            {"expr": "sum by(le)(rate(http_request_duration_seconds_bucket[5m]))", "legendFormat": "le={{le}}", "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}}
          ]
        }
      ],
      "editable": true,
      "refresh": "15s"
    }