# Grafana Deployment + sidecar dashboard loader.
# Datasources come from configmap-datasources.yaml mounted into /etc/grafana/provisioning/datasources/.
# Dashboards are ConfigMaps (commit 8) labeled grafana_dashboard=1; kiwigrid/k8s-sidecar
# watches them and writes JSON into emptyDir /var/lib/grafana/dashboards/,
# while dashboards-provider config (configmap-dashboards-provider.yaml) instructs
# Grafana to load *.json from that directory at startup + periodically.
# Admin password read from mounted Secret (secret.yaml) - never inline.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana-sidecar
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER__FILE
              value: /etc/grafana-secrets/admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana-secrets/admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Anonymous access is read-only (Viewer) and exists so the operator
            # console's embedded Grafana renders a dashboard instead of a login
            # form: the iframe is same-purpose with the ArgoCD anonymous
            # readonly role, and Grafana is ClusterIP-only, reached through an
            # on-demand loopback port-forward. Editing, alerting and admin all
            # still require the admin login below.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Without this Grafana refuses to be framed at all.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          volumeMounts:
            - name: config-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: config-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: false
            - name: grafana-secrets
              mountPath: /etc/grafana-secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: grafana-sc-dashboard
          image: kiwigrid/k8s-sidecar:1.27.6
          env:
            - name: LABEL
              value: "grafana_dashboard"
            - name: FOLDER
              value: /var/lib/grafana/dashboards
            - name: METHOD
              value: WATCH
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: ALL
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsUser: 472
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: config-datasources
          configMap:
            name: grafana-datasources
        - name: config-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          emptyDir: {}
        - name: grafana-secrets
          secret:
            secretName: grafana-admin-credentials
            items:
              - key: admin-user
                path: admin-user
              - key: admin-password
                path: admin-password
