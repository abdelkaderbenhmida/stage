# Grafana admin credentials.
#
# This file intentionally declares NO Secret.
#
# It used to declare `grafana-admin-credentials` with placeholder values and a
# note to inject the real ones. Under GitOps that is not a note, it is a
# password: this directory is an ArgoCD Application with selfHeal, so whatever
# a bootstrap script writes is reverted to the placeholder within minutes —
# leaving Grafana reachable with a credential that is committed in git and
# identical on every install.
#
# Create it out-of-band instead, before Grafana starts:
#
#   kubectl -n monitoring create secret generic grafana-admin-credentials \\
#     --from-literal=admin-user=admin \\
#     --from-literal=admin-password="$(openssl rand -base64 24)"
#
# The Deployment references it with optional: false, so a missing Secret fails
# the pod loudly rather than starting Grafana with no password set.
