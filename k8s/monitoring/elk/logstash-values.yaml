# Logstash — receives beats input on 5044, forwards to Elasticsearch on 9200.
# Parses the JSON stdout emitted by the FastAPI microservices (Phase 5
# log_config.py) so Kibana can query `level`, `service`, `event` as fields.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash
  namespace: monitoring
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: devops-platform
---
# Service — beats input (5044) + monitoring API (9600).
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: monitoring
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: beats
      port: 5044
      targetPort: beats
      protocol: TCP
    - name: monitoring
      port: 9600
      targetPort: monitoring
      protocol: TCP
  selector:
    app.kubernetes.io/name: logstash
---
# ConfigMap — logstash.yml + pipelines.yml + json-filter.conf.
# Single pipeline: beats → json codec → mutate (index name per svc) → elasticsearch output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: devops-platform
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    http.port: 9600
    pipeline.workers: 2
    pipeline.batch.size: 125
    queue.type: persisted
    path.queue: /usr/share/logstash/queue
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/logstash.conf"
  logstash.conf: |
    input {
      beats {
        port => 5044
        codec => plain { charset => "UTF-8" }
      }
    }

    filter {
      # The FastAPI json-logger emits one JSON object per line.
      #
      # skip_on_invalid_json is essential, not tidiness. Plenty of collected
      # lines are not JSON — the JVM stack traces from Elasticsearch and
      # Logstash itself, nginx access logs, kubelet output — and without this
      # the filter logs a WARN for every one of them. Those warnings are
      # themselves collected, which produces more warnings: 8.8 million
      # documents in a single day on this cluster, all of them Logstash
      # complaining about Logstash.
      json {
        source => "message"
        target => "app"
        remove_field => ["message"]
        skip_on_invalid_json => true
      }

      # Pull structured fields up to the top level for Kibana search.
      mutate {
        add_field => {
          "service" => "%{[app][event]}"
          "log_level" => "%{[app][level]}"
        }
      }

      # Tag container logs with k8s metadata exposed by Filebeat.
      if [kubernetes] {
        mutate {
          add_field => {
            "pod_name" => "%{[kubernetes][pod][name]}"
            "namespace" => "%{[kubernetes][namespace]}"
            "container_name" => "%{[kubernetes][container][name]}"
          }
        }
      }

      # Drop probe noise — readiness/liveness logs pollute Kibana.
      if "/livez" in [app][event] or "/readyz" in [app][event] {
        drop {}
      }

      # Route to a per-tenant index. Computed into @metadata rather than a
      # real field so it is not stored on every document.
      #
      # The namespace is matched against the platform's own derivation rule
      # rather than "anything that is not devops-platform": a log line whose
      # namespace field is missing or malformed must not be able to invent an
      # index name, so anything unrecognised goes to the platform index where
      # only operators can read it.
      if [namespace] =~ /^p-[0-9a-f]{20}$/ {
        mutate {
          add_field => { "[@metadata][target_index]" => "tenant-%{namespace}-%{+YYYY.MM.dd}" }
        }
      } else {
        mutate {
          add_field => { "[@metadata][target_index]" => "devops-platform-%{+YYYY.MM.dd}" }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch.monitoring.svc.cluster.local:9200"]
        user => "elastic"
        password => "${ELASTIC_PASSWORD}"
        # One index per tenant namespace, not one shared index.
        #
        # This is what makes per-tenant Elasticsearch roles possible on the
        # basic licence: index-pattern privileges are basic, but filtering
        # rows *within* a shared index needs document-level security, which is
        # Platinum. With everything in `devops-platform-*` the only options
        # were "every tenant sees every tenant's logs" or "no tenant sees
        # anything".
        #
        # Tenant namespaces are `p-<20 hex>` (core/validation.k8s_namespace);
        # the platform's own workloads keep the original index name so the
        # operator dashboards and their saved searches keep working.
        index => "%{[@metadata][target_index]}"
        ilm_enabled => false
        manage_template => false
      }
    }
---
# Secret `logstash-elasticsearch-auth` (ELASTIC_PASSWORD) is deliberately NOT
# declared here. It is created out-of-band by
# scripts/bootstrap-elasticsearch-secret.sh, exactly like `kibana-credentials`.
#
# It used to be declared with a placeholder value and the instruction to
# inject the real one. That cannot work under GitOps: this directory is an
# ArgoCD Application with selfHeal, so within a couple of minutes ArgoCD put
# the placeholder back and Logstash went to 401 against Elasticsearch. The
# result was a stack that looked healthy — Logstash restarts, so its pod is
# often "Running" — while shipping precisely zero log lines. A committed
# placeholder for a secret is not a reminder, it is a value that wins.
#
# The Deployment below references it with optional: false, so a missing Secret
# fails the pod loudly instead of starting Logstash with no credential.
---
# Deployment — 1 replica for 3-node dev cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: monitoring
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 1
  strategy:
    type: Recreate  # Single pipeline writer — avoid dual-runner write race.
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: logstash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: monitoring
              containerPort: 9600
              protocol: TCP
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logstash-elasticsearch-auth
                  key: ELASTIC_PASSWORD
                  optional: false
            - name: LS_JAVA_OPTS
              # 256m was sized for a Logstash nothing actually shipped to.
              # Once filebeat was pointed here (it had been writing straight to
              # Elasticsearch), the first real backlog — tens of thousands of
              # buffered events across ~60 harvested files — exhausted the heap
              # and the JVM died with OutOfMemoryError mid-bulk, restarted, and
              # met the same backlog again.
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              # Must exceed the heap with room for the JVM's off-heap use —
              # direct buffers, metaspace, thread stacks. A 512m heap in a 1Gi
              # container leaves too little and trades a heap OOM for an
              # OOMKill, which is harder to read because nothing is logged.
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # queue + logs dirs need write
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: config
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
              readOnly: true
            - name: queue
              mountPath: /usr/share/logstash/queue
            - name: logs
              mountPath: /usr/share/logstash/logs
      volumes:
        - name: config
          configMap:
            name: logstash-config
        - name: pipeline
          configMap:
            name: logstash-config
        - name: queue
          emptyDir: {}
        - name: logs
          emptyDir: {}
