# Filebeat — DaemonSet tailing /var/log/containers/*.log on every node,
# forwarding to Logstash on port 5044 (per Phase 6 spec).
# Uses autodiscovery to enrich logs with pod labels (namespace, container, svc).
#
# Runs in `logging`, not `monitoring`, for the same reason promtail does: a log
# collector reads the kubelet's files through hostPath mounts, and `monitoring`
# enforces the PodSecurity "restricted" profile, which forbids them. The
# DaemonSet was in `monitoring` and every pod creation was rejected with
# "restricted volume types" — desired 1, current 0, for long enough that the
# ELK half of the logging stack had no input at all while every object in it
# reported Synced and Healthy. A DaemonSet with no pods is easy to miss.
#
# Relaxing `monitoring` instead would weaken Prometheus, Grafana, Kibana and
# Elasticsearch to accommodate one workload; `logging` confines the exemption
# to the pods that need it (see k8s/monitoring/loki/namespace.yaml).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
---
# RBAC — Filebeat needs to query the kube-apiserver for pod metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
# ConfigMap — filebeat.yml + autodiscover rules + processors.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
data:
  filebeat.yml: |
    filebeat.config:
      inputs:
        path: ${path.config}/inputs.d/*.yml
        reload.enabled: false

    filebeat.autodiscover:
      providers:
        - type: kubernetes
          hints.enabled: true
          node: ${NODE_NAME}
          # Only tail containers matching the devops-platform workloads.
          templates:
            - condition:
                contains:
                  kubernetes.labels.app_kubernetes_io/part-of: "devops-platform"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}*.log

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
      - drop_fields:
          fields:
            - agent.ephemeral_id
            - agent.id
            - agent.type
            - agent.version
            - ecs.version
            - host.mac
            - input.type
            - log.file.path
            - log.offset
            - stream
          ignore_missing: true

    # Ships to Logstash, NOT straight to Elasticsearch.
    #
    # It used to write directly to Elasticsearch, into a single shared
    # `filebeat-*` data stream — which quietly defeated the per-tenant log
    # access this stack exists to provide. Tenancy is expressed in the index
    # name (`tenant-<namespace>-*`, see core/elk_tenancy.py) because index
    # privileges are the only enforcement the basic licence has, and the
    # routing that produces those names lives in the Logstash pipeline. With
    # Logstash bypassed, every tenant's lines landed in one index no tenant
    # role grants, so the Kibana space showed nothing at all while
    # Elasticsearch filled up regardless.
    #
    # The queue settings below already assumed this path — they talk about
    # holding events "when Logstash is down".
    output.logstash:
      hosts: ["logstash.monitoring.svc.cluster.local:5044"]
      worker: 2

    # Block-level: when Logstash is down, hold the events in the spooler
    # (default 2048 events) rather than dropping them.
    queue.mem:
      events: 4096
      flush.min_events: 1024
      flush.timeout: 5s

    # Slow log + JSON stdout to /var/log/filebeat for debugging.
    logging.level: info
    logging.to_files: false
    logging.to_stderr: true
    logging.json: true
---
# DaemonSet — one Filebeat pod per node, hostPath-mounted /var/log.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: filebeat
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.14.0
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/filebeat/filebeat.yml"
            - "-e"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # No Elasticsearch credential here: filebeat ships to Logstash,
            # and Logstash is what authenticates to Elasticsearch. Keeping one
            # would also mean copying the Secret into this namespace, since
            # Secrets are namespaced and filebeat runs in `logging`.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # data + spooler dirs
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - /usr/share/filebeat/filebeat
                - test
                - config
                - -c
                - /etc/filebeat/filebeat.yml
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /usr/share/filebeat/filebeat
                - test
                - config
                - -c
                - /etc/filebeat/filebeat.yml
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/filebeat-data
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
        - name: data
          emptyDir: {}
