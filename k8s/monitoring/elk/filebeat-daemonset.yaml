# Filebeat — DaemonSet tailing /var/log/containers/*.log on every node,
# forwarding to Logstash on port 5044 (per Phase 6 spec).
# Uses autodiscovery to enrich logs with pod labels (namespace, container, svc).
#
# Runs in `logging`, not `monitoring`, for the same reason promtail does: a log
# collector reads the kubelet's files through hostPath mounts, and `monitoring`
# enforces the PodSecurity "restricted" profile, which forbids them. The
# DaemonSet was in `monitoring` and every pod creation was rejected with
# "restricted volume types" — desired 1, current 0, for long enough that the
# ELK half of the logging stack had no input at all while every object in it
# reported Synced and Healthy. A DaemonSet with no pods is easy to miss.
#
# Relaxing `monitoring` instead would weaken Prometheus, Grafana, Kibana and
# Elasticsearch to accommodate one workload; `logging` confines the exemption
# to the pods that need it (see k8s/monitoring/loki/namespace.yaml).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
---
# RBAC — Filebeat needs to query the kube-apiserver for pod metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
# ConfigMap — filebeat.yml + autodiscover rules + processors.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
data:
  filebeat.yml: |
    # Where the registry lives — the record of how far each file has been
    # read. It must be the mounted path, or filebeat writes it to the
    # container's own filesystem and it is lost on every restart.
    path.data: /var/lib/filebeat-data

    filebeat.config:
      inputs:
        path: ${path.config}/inputs.d/*.yml
        reload.enabled: false

    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          # Hints are on so a pod can opt in with co.elastic.logs/* annotations,
          # but their DEFAULT config is off.
          #
          # With hints.default_config left at its default, autodiscover tails
          # every pod on the node and the templates below only add to that —
          # they do not restrict it, despite reading as though they do. The
          # effect was that ArgoCD's controllers, kube-apiserver and the rest
          # of kube-system were all collected: a quarter of a million documents
          # of ArgoCD chatter alone in one day, which is what actually filled
          # the index, not the tenant workloads it was meant to carry.
          hints.enabled: true
          hints.default_config:
            enabled: false
          # These templates are now the ONLY sources collected.
          templates:
            # The platform's own services, identified by their label.
            - condition:
                contains:
                  kubernetes.labels.app_kubernetes_io/part-of: "devops-platform"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}*.log

            # Tenant workloads.
            #
            # Matched on the namespace, not on a label: a tenant's manifests
            # are their own and carry whatever labels they choose, so nothing
            # about a tenant pod is guaranteed except the namespace it runs
            # in. That name is derived from the project UUID
            # (core/validation.k8s_namespace), which is exactly the shape
            # matched here — and the same shape the Logstash pipeline routes
            # on when it picks the tenant's index.
            #
            # Without this, per-tenant log access has nothing to show: the
            # only condition was the platform's own part-of label, so no
            # tenant line was ever collected, and a tenant's Kibana space was
            # empty for want of input rather than for want of permission.
            - condition:
                regexp:
                  kubernetes.namespace: "^p-[0-9a-f]{20}$"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}*.log

    processors:
      # Never collect the logging pipeline's own output.
      #
      # filebeat, logstash, elasticsearch and kibana all carry
      # part-of=devops-platform, so the first autodiscover condition matched
      # them and filebeat shipped Logstash's log lines to Logstash. Anything
      # Logstash then said about them came straight back — a loop that
      # amplifies rather than settles, and it wrote 8.8 million documents in a
      # day before anyone looked at the index size.
      #
      # A component cannot be a useful source of its own telemetry here;
      # `kubectl logs` is the right tool for debugging these four.
      - drop_event:
          when:
            or:
              - equals:
                  kubernetes.namespace: "logging"
              - regexp:
                  kubernetes.labels.app_kubernetes_io/name: "^(logstash|elasticsearch|kibana|filebeat)$"
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
      - drop_fields:
          fields:
            - agent.ephemeral_id
            - agent.id
            - agent.type
            - agent.version
            - ecs.version
            - host.mac
            - input.type
            - log.file.path
            - log.offset
            - stream
          ignore_missing: true

    # Ships to Logstash, NOT straight to Elasticsearch.
    #
    # It used to write directly to Elasticsearch, into a single shared
    # `filebeat-*` data stream — which quietly defeated the per-tenant log
    # access this stack exists to provide. Tenancy is expressed in the index
    # name (`tenant-<namespace>-*`, see core/elk_tenancy.py) because index
    # privileges are the only enforcement the basic licence has, and the
    # routing that produces those names lives in the Logstash pipeline. With
    # Logstash bypassed, every tenant's lines landed in one index no tenant
    # role grants, so the Kibana space showed nothing at all while
    # Elasticsearch filled up regardless.
    #
    # The queue settings below already assumed this path — they talk about
    # holding events "when Logstash is down".
    output.logstash:
      hosts: ["logstash.monitoring.svc.cluster.local:5044"]
      worker: 2

    # Block-level: when Logstash is down, hold the events in the spooler
    # (default 2048 events) rather than dropping them.
    queue.mem:
      events: 4096
      flush.min_events: 1024
      flush.timeout: 5s

    # Slow log + JSON stdout to /var/log/filebeat for debugging.
    logging.level: info
    logging.to_files: false
    logging.to_stderr: true
    logging.json: true
---
# DaemonSet — one Filebeat pod per node, hostPath-mounted /var/log.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: filebeat
      securityContext:
        # runAsNonRoot is set per-container, not here: the init container
        # below must be root to chown the hostPath registry directory, while
        # filebeat itself stays non-root.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        # Hands the registry directory to filebeat's UID.
        #
        # A hostPath is created by the kubelet owned by root, and filebeat runs
        # as 1000 (unlike promtail alongside it, which runs as root). Without
        # this the pod starts and immediately exits with "failed to create Beat
        # meta file: permission denied" — a CrashLoopBackOff whose message
        # names a file rather than the ownership.
        #
        # Root is confined to this one chown; the collector itself stays
        # non-root, which is the reason not to simply run filebeat as root.
        - name: fix-registry-permissions
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - chown -R 1000:1000 /var/lib/filebeat-data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/filebeat-data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.14.0
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/filebeat/filebeat.yml"
            - "-e"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # No Elasticsearch credential here: filebeat ships to Logstash,
            # and Logstash is what authenticates to Elasticsearch. Keeping one
            # would also mean copying the Secret into this namespace, since
            # Secrets are namespaced and filebeat runs in `logging`.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # data + spooler dirs
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - /usr/share/filebeat/filebeat
                - test
                - config
                - -c
                - /etc/filebeat/filebeat.yml
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /usr/share/filebeat/filebeat
                - test
                - config
                - -c
                - /etc/filebeat/filebeat.yml
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/filebeat-data
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
        # Remembers how far each file has been read, so a restart does not
        # re-ship every line already in Elasticsearch — the same reason
        # promtail keeps its positions file on a hostPath.
        #
        # As an emptyDir this was discarded with the pod, so every restart
        # re-ingested every log file on the node from the beginning. That is
        # not just volume: the documents are duplicates, so counts and any
        # rate built on them are wrong, and nothing about it looks like an
        # error.
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
