# Elasticsearch StatefulSet — single-node (3-node dev cluster).
# PVC 10Gi, runAsNonRoot UID 1000, security hardening (P1/P2).
# Image: elasticsearch:8.14.0 (compat with Kibana 8.14.0).
# License: basic (free), xpack.security enabled with a generated password
#   stored in the `elasticsearch-credentials` Secret (out-of-band).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: elasticsearch
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: elasticsearch
  apiGroup: rbac.authorization.k8s.io
---
# Service — ClusterIP for Logstash / Kibana to reach ES.
# Headless-less: regular ClusterIP so DNS round-robin works for single node.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch
---
# ConfigMap — elasticsearch.yml.
# Single-node cluster (discovery.type=single) to avoid zen election timeouts
# on the 3-node dev platform. Production: role-based master/data separation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
data:
  elasticsearch.yml: |
    cluster.name: devops-platform
    network.host: 0.0.0.0
    discovery.type: single-node
    xpack.security.enabled: true
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.ml.enabled: false
    xpack.monitoring.collection.enabled: true
    action.destructive_requires_name: true
---
# Secret — bootstrap elastic + kibana_system passwords.
# Created out-of-band (see scripts/bootstrap-elasticsearch-secret.sh)
# so no plaintext secret is shipped in git.
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
type: Opaque
stringData:
  # DO NOT COMMIT REAL VALUES. Bootstrap out-of-band with:
  #   kubectl -n monitoring create secret generic elasticsearch-credentials \
  #     --from-literal=ELASTIC_PASSWORD=$ELASTIC_PASSWORD \
  #     --from-literal=KIBANA_PASSWORD=$KIBANA_PASSWORD \
  #     --dry-run=client -o yaml | kubectl apply -f -
  ELASTIC_PASSWORD: "DO-NOT-COMMIT-INJECT-VIA-Scripts-bootstrap-elasticsearch-secret.sh"
  KIBANA_PASSWORD: "DO-NOT-COMMIT-INJECT-VIA-Scripts-bootstrap-elasticsearch-secret.sh"
---
# StatefulSet — 1 replica, PVC 10Gi local-path.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: elasticsearch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ES refuses to start with vm.max_map_count < 262144 — privileged
        # initContainer bumps it on the host. Removed in managed cloud / EKS
        # where nodeAMI already sets it.
        # WARNING: vm.max_map_count must be set manually on node before deploy:
        #   sudo sysctl -w vm.max_map_count=262144
        #   echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
        # - name: sysctl
        #   image: busybox:1.36.1
        #   securityContext:
        #     runAsUser: 0
        #     privileged: true
        #     capabilities:
        #       drop: ["ALL"]
        #       add: ["SYS_CHROOT"]
        #     allowPrivilegeEscalation: false
        #   command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: ELASTIC_PASSWORD
                  optional: false  # fail-closed
            # ES Sets this from file when running, but explicit lets Kibana
            # & Logstash use the same Secret reference.
            - name: ES_SETTINGS_DISCOVERY_TYPE
              value: "single-node"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # ES writes to /usr/share/elasticsearch/data
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: elasticsearch-data
          app.kubernetes.io/part-of: devops-platform
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path
