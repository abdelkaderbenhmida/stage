# Elasticsearch StatefulSet — single-node (3-node dev cluster).
# PVC 10Gi, runAsNonRoot UID 1000, security hardening (P1/P2).
# Image: elasticsearch:8.14.0 (compat with Kibana 8.14.0).
# License: basic (free), xpack.security enabled with a generated password
#   stored in the `elasticsearch-credentials` Secret (out-of-band).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: elasticsearch
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: elasticsearch
  apiGroup: rbac.authorization.k8s.io
---
# Service — ClusterIP for Logstash / Kibana to reach ES.
# Headless-less: regular ClusterIP so DNS round-robin works for single node.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch
---
# ConfigMap — elasticsearch.yml.
# Single-node cluster (discovery.type=single) to avoid zen election timeouts
# on the 3-node dev platform. Production: role-based master/data separation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
data:
  elasticsearch.yml: |
    cluster.name: devops-platform
    network.host: 0.0.0.0
    discovery.type: single-node
    xpack.security.enabled: true
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.ml.enabled: false
    xpack.monitoring.collection.enabled: false
    action.destructive_requires_name: true
    # Memory trim for 1.9Gi dev nodes: avoid mmap of Lucene segments and cap
    # the indexing buffer so RSS stays far below the container limit.
    node.store.allow_mmap: false
    indices.memory.index_buffer_size: 64mb
    # 40% of a 512m heap is 205MB, and Kibana's own start-up — it installs
    # index templates and alerting resources — pushes past that on an
    # otherwise idle cluster. The breaker then rejects requests with
    # "Data too large", Kibana never finishes installing, and its readiness
    # probe returns 503 forever with the cause visible only in ES's log.
    # 70% still trips well before the JVM is in trouble.
    indices.breaker.total.limit: 70%
---
# Secret `elasticsearch-credentials` (ELASTIC_PASSWORD + KIBANA_PASSWORD) is
# NOT declared here — it is created out-of-band by
# scripts/bootstrap-elasticsearch-secret.sh so no plaintext ships in git.
# The StatefulSet below references it and fails closed if it is missing.
---
# StatefulSet — 1 replica, PVC 10Gi local-path.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: devops-platform
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: elasticsearch
      # Keep ES off the control-plane node to reduce API/DNS instability.
      # Prefer a worker node, do not require one. As a hard requirement this
      # is unschedulable on any single-node cluster (kind, k3s, minikube),
      # where the only node IS the control plane — and a Pending pod with a
      # node-affinity message reads like a capacity problem rather than a
      # manifest that can never be satisfied. It sat Pending for five days
      # exactly that way.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # ES refuses to start with vm.max_map_count < 262144. The privileged
      # initContainer that used to bump it is kept below as a comment, for a
      # host where it is needed.
      #
      # The `initContainers:` key itself is NOT declared here. With every entry
      # under it commented out the key parses as null, Kubernetes drops it from
      # the stored object, and ArgoCD then compares "initContainers: null" in
      # git against a live object that has no such field — a diff no sync can
      # ever resolve. The elk Application sat OutOfSync on exactly that, which
      # also masks any real drift underneath it.
      #
      # Uncomment the block AND add the `initContainers:` key back together.
        # WARNING: vm.max_map_count must be set manually on node before deploy:
        #   sudo sysctl -w vm.max_map_count=262144
        #   echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
        # - name: sysctl
        #   image: busybox:1.36.1
        #   securityContext:
        #     runAsUser: 0
        #     privileged: true
        #     capabilities:
        #       drop: ["ALL"]
        #       add: ["SYS_CHROOT"]
        #     allowPrivilegeEscalation: false
        #   command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=256m -Dio.netty.leakDetectionLevel=disabled"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: ELASTIC_PASSWORD
                  optional: false  # fail-closed
            # ES Sets this from file when running, but explicit lets Kibana
            # & Logstash use the same Secret reference.
            - name: ES_SETTINGS_DISCOVERY_TYPE
              value: "single-node"
          resources:
            requests:
              cpu: 200m
              memory: 1280Mi
            limits:
              cpu: "1"
              # Must exceed the heap with room for the JVM's own off-heap use
              # (direct buffers, metaspace, thread stacks). A 1g heap in a 1g
              # container is an OOMKill waiting for the first real query.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # ES writes to /usr/share/elasticsearch/data
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 240
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: elasticsearch-data
          app.kubernetes.io/part-of: devops-platform
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path
