# Kibana — visual discovery layer on top of Elasticsearch.
# Connects to ES via http://elasticsearch.monitoring.svc.cluster.local:9200,
# authenticates with the kibana_system user (password injected out-of-band).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: devops-platform
---
# Service — ClusterIP 5601, the canonical Kibana port.
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kibana
---
# ConfigMap — kibana.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: devops-platform
data:
  kibana.yml: |
    server.name: kibana
    server.host: 0.0.0.0
    server.port: 5601

    elasticsearch.hosts: ["http://elasticsearch.monitoring.svc.cluster.local:9200"]
    elasticsearch.ssl.verificationMode: "none"

    monitoring.ui.container.elasticsearch.enabled: true
    # Trim memory on the 1.9Gi dev nodes: disable unused xpack plugins so the
    # V8 heap stays well under the container limit.
    telemetry.enabled: false
    xpack.reporting.enabled: false
    xpack.fleet.enabled: false
    xpack.encryptedSavedObjects.encryptionKey: "00000000000000000000000000000000"
---
# Secret `kibana-credentials` (KIBANA_PASSWORD) is NOT declared here — it is
# created out-of-band by scripts/bootstrap-elasticsearch-secret.sh.
# The Deployment below references it and fails closed if it is missing.
---
# Deployment — 1 replica for 3-node dev cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: kibana
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      nodeSelector:
        kubernetes.io/hostname: worker-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          env:
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: KIBANA_PASSWORD
                  optional: false  # fail-closed
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: KIBANA_PASSWORD
                  optional: false  # fail-closed
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Kibana writes to /usr/share/kibana/data
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # Kibana 8 returns 503 on /api/status while plugins load (3-4 min on
            # slow dev nodes); an httpGet liveness probe false-kills it mid-boot.
            # tcpSocket only asserts the port is listening.
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kibana-config
