# SLO PrometheusRules matching Phase 6 spec (files.md:162-165).
# 3 rules: availability < 99.9% over 30d, P95 latency > 200ms, 5xx rate > 1%.
# Namespace=monitoring, picked up by Prometheus ruleSelector={}.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: slo-rules
    app.kubernetes.io/part-of: devops-platform
spec:
  groups:
    # ── Availability: up metric < 99.9% over 30 days ──
    # Recording rule pre-computes avg_over_time to keep raw eval cheap.
    # Generic across ALL service targets: the shared ServiceMonitor relabels
    # app.kubernetes.io/part-of into the `part_of` label, so any discovered
    # service is covered — add/remove services, the rule adapts.
    - name: slo-availability-recording
      interval: 5m
      rules:
        - record: service:availability_30d:ratio
          expr: avg_over_time(up{part_of="devops-platform"}[30d])
    - name: slo-availability
      interval: 5m
      rules:
        - alert: SLOAvailabilityBreach
          expr: (1 - service:availability_30d:ratio) * 100 > 0.1
          for: 10m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "Availability < 99.9% over 30d on {{ $labels.job }}"
            description: "{{ $labels.job }} availability is {{ printf \"%.4f\" (1 - $value / 100) }} (target 99.9%) over the last 30 days."
    # ── Latency: P95 > 200ms ──
    - name: slo-latency
      interval: 5m
      rules:
        - alert: SLOLatencyP95Breach
          expr: |
            histogram_quantile(0.95,
              sum by(le, handler) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 0.2
          for: 5m
          labels:
            severity: warning
            slo: latency
          annotations:
            summary: "P95 latency > 200ms on {{ $labels.handler }}"
            description: "Endpoint {{ $labels.handler }} P95 latency is {{ printf \"%.3f\" $value }}s (SLO ≤ 200ms)."
    # ── Error rate: 5xx > 1% ──
    - name: slo-error-rate
      interval: 5m
      rules:
        - alert: SLO5xxErrorRateBreach
          expr: |
            sum by(handler) (rate(http_requests_total{status_code=~"5.."}[5m]))
              / sum by(handler) (rate(http_requests_total[5m]))
              * 100 > 1
          for: 2m
          labels:
            severity: critical
            slo: error-rate
          annotations:
            summary: "5xx error rate > 1% on {{ $labels.handler }}"
            description: "Endpoint {{ $labels.handler }} is returning {{ printf \"%.2f\" $value }}% 5xx errors (SLO ≤ 1%)."
    # ── Incident 1: container memory usage ratio > 80% (noisy-neighbour / OOMKill early warning) ──
    # Compares working-set against the spec memory limit. Fires before kubelet eviction.
    - name: platform-resource-saturation
      interval: 30s
      rules:
        - alert: ContainerMemoryRatioHigh
          expr: |
            sum by(pod, namespace) (container_memory_working_set_bytes)
              / sum by(pod, namespace) (container_spec_memory_limit_bytes > 0)
              * 100 > 80
          for: 2m
          labels:
            severity: warning
            incident: "1"
          annotations:
            summary: "Memory usage > 80% of limit on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} (ns {{ $labels.namespace }}) memory ratio is {{ printf \"%.1f\" $value }}% — noisy-neighbour / eviction risk (Incident 1)."
        - alert: PodEvictionOngoing
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} > 0
          for: 1m
          labels:
            severity: critical
            incident: "1"
          annotations:
            summary: "OOMKilled pod detected — {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} (ns {{ $labels.namespace }}) was OOMKilled — LimitRange/requests/limits need review."
    # ── Incident 9: HPA pinned at maxReplicas for >15m (cost runaway / leak-driven scale-up) ──
    - name: platform-hpa-runaway
      interval: 30s
      rules:
        - alert: HPAPinnedAtMaxReplicas
          expr: |
            kube_hpa_status_current_replicas == kube_hpa_spec_max_replicas
          for: 15m
          labels:
            severity: warning
            incident: "9"
          annotations:
            summary: "HPA {{ $labels.hpa }} at maxReplicas for >15m"
            description: "HPA {{ $labels.hpa }} (ns {{ $labels.namespace }}) pinned at maxReplicas — possible memory leak driving scale-up (Incident 9). Check app + alert mirrors cost-saturation."