# Alertmanager instance managed by Prometheus Operator.
# 1 replica, PVC 2Gi for notification state, ns=monitoring.
# Loaded config is stored in alertmanager-config Secret (commit 11).
# Until then the operator ships a default empty config.
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: devops-platform
spec:
  image: quay.io/prometheus/alertmanager:v0.27.0
  version: v0.27.0
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: alertmanager
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        allowPrivilegeEscalation: false
