# Prometheus Helm chart values (arborescence.md Phase 6 #1).
#
# Chart: prometheus-community/prometheus
# Install: helm install prometheus prometheus-community/prometheus -f k8s/monitoring/prometheus/values.yaml -n monitoring
#
# The repo also ships a Prometheus operator manifest set under
# k8s/monitoring/prometheus/{operator,crds,prometheus,service}.yaml for a
# pure-manifest path. Use ONE of the two paths (Helm OR manifests), not both.

prometheus:
  # Phase 6 #1 — scrape interval of 15 seconds.
  scrapeInterval: 15s
  evaluationInterval: 15s
  scrapeTimeout: 10s

  # SRE: 4 Golden Signals: alerting rule selectors must be explicit,
  # not glob-everything. Notification happens via alertmanager.
  serviceMonitors:
    - selector:
        matchLabels:
          app.kubernetes.io/part-of: devops-platform
      namespaceSelector:
        matchNames:
          - devops-platform
      endpoints:
        - port: http
          path: /metrics
          interval: 15s

alertRelabelConfigs:
  - action: labeldrop
    regex: temporary_label

alertmanager:
  enabled: true
  # Routing to our dedicated AlertManager deployment in monitoring ns.
  endpoint: alertmanager.monitoring.svc.cluster.local:9093
  # PodSecurity "restricted" is enforced on the monitoring namespace; chart
  # defaults don't set container-level fields, so pods get rejected without these.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

rbac:
  create: true

configmapReload:
  prometheus:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

server:
  retention: 15d
  persistentVolume:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  # PodSecurity "restricted" enforced on monitoring ns (see alertmanager above).
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

nodeExporter:
  enabled: true

pushgateway:
  enabled: false
