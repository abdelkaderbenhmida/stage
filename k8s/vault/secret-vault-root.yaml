# Kubernetes Secret — Vault root token for Dev mode
# Microservices reference this via env[].valueFrom.secretKeyRef
# In production: use Kubernetes Auth method + Vault Agent Injector instead.
#
# Apply AFTER deploying Vault:
#   kubectl apply -f k8s/vault/secret-vault-root.yaml
apiVersion: v1
kind: Secret
metadata:
  name: vault-root-token
  namespace: devops-platform
  labels:
    app.kubernetes.io/part-of: devops-platform
type: Opaque
stringData:
  root-token: "root-token-change-me"