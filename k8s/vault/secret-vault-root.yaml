# Kubernetes Secret — Vault root token (DEV MODE ONLY)
#
# !! WARNING !! DO NOT COMMIT A REAL TOKEN TO GIT !!
#
# This file is a TEMPLATE. The real token is injected out-of-band so the
# committed value is never a live secret. Two supported injection paths:
#
#   Path A (SOPS / Sealed Secrets for production):
#     Encrypt this file with SOPS or SealedSecrets and commit the encrypted
#     form. The decrypted value is what controllers apply to the cluster.
#     See ../../docs/secrets-management.md.
#
#   Path B (out-of-band creation for dev / homelab — RECOMMENDED here):
#     Do NOT apply this file as-is. Instead create the secret out-of-band
#     via the bootstrap script, which references a value supplied through
#     an environment variable so no secret lands in git history:
#
#       VAULT_DEV_ROOT_TOKEN="<random-64-hex>" \
#         scripts/bootstrap-vault-secret.sh
#
#     The bootstrap script runs `kubectl create secret` with --dry-run=client
#     carried on stdin so the token never touches disk or the git index, and
#     rotates the secret by deleting + recreating it.
#
# After creating the Secret, apps reference it via env[].valueFrom.secretKeyRef
# (see k8s/apps/*-deployment.yaml). In production use the Vault Kubernetes
# auth method + per-service ServiceAccounts (see k8s/vault/README.md) instead
# of this shared root token.
#
# Rotation: re-run the bootstrap script with a new token value and restart
# the Vault pod + apps. The old token is invalidated because Vault dev mode
# derives authority purely from the --dev-root-token-id flag.
apiVersion: v1
kind: Secret
metadata:
  name: vault-root-token
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: vault-root-token
    app.kubernetes.io/part-of: devops-platform
  annotations:
    # Marker so scanners / humans know this is a template, not a live secret.
    stage.devops-platform/secret-source: "out-of-band"
    stage.devops-platform/rotation: "see scripts/bootstrap-vault-secret.sh"
type: Opaque
# `stringData` intentionally omitted — the real token is injected out-of-band.
# Kept as an empty Secret so rbac/networkpolicy tooling sees the object shape.
stringData: {}
