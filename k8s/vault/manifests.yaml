---
# Vault Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: devops-platform
    # Pod Security Admission: enforce=privileged. Vault needs IPC_LOCK
    # (mlock, prevents secrets swapping to disk) which baseline still
    # disallows — any added capability is rejected under baseline, not
    # just the restricted profile.
    # DEV-ONLY override — production must tune the Vault Deployment
    # securityContext explicitly rather than relaxing the namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Service — exposes Vault server inside the cluster
# Pods access Vault at: http://vault-service.vault.svc.cluster.local:8200
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: vault-api
      port: 8200
      targetPort: vault-api
      protocol: TCP
    - name: vault-metrics
      port: 8201
      targetPort: vault-metrics
      protocol: TCP
  type: ClusterIP
---
# Vault Deployment — dev mode (dev server, auto-unsealed)
# In production: use statefulset + raft storage, manual/auto unseal, TLS,
# and the Kubernetes auth method (see k8s/vault/README.md).
#
# The dev root token is NOT hardcoded here. It is sourced from the
# `vault-root-token` Secret in the `devops-platform` namespace (created
# out-of-band with scripts/bootstrap-vault-secret.sh) so no secret ships
# in git. The same Secret value is passed both to the Vault server args
# (`-dev-root-token-id`) and to the setup Job, keeping them consistent
# without any committed value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: devops-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate  # Dev server cannot have parallel instances
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: devops-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      serviceAccountName: vault-sa  # Wire the SA that was previously unused.
      automountServiceAccountToken: true  # Needed for Kubernetes auth method.
      # DEV ONLY — Vault needs CAP_SETFCAP which libvirt nested virt blocks
      # for non-root UIDs. runAsUser:0 also required for Vault to bind
      # privileged port 8200 in dev mode. Production: run as non-root
      # + harden host OS to grant CAP_SETFCAP properly.
      # Pod Security Admission: namespace enforce=baseline (line 14).
      securityContext:
         runAsUser: 0
         runAsGroup: 0
         fsGroup: 0
         seccompProfile:
           type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: vault
          image: hashicorp/vault:1.15.2
          imagePullPolicy: IfNotPresent
          # Dev mode flags — auto-unsealed, in-memory storage.
          # Root token value comes from the Secret by env substitution so
          # no secret is committed; Vault dev mode startup must see a non-
          # empty VAULT_DEV_ROOT_TOKEN_ID env var.
          args:
            - "server"
            - "-dev"
            - "-dev-root-token-id=$(VAULT_DEV_ROOT_TOKEN_ID)"
            - "-dev-listen-address=0.0.0.0:8200"
            # DEVMODE no IPC_LOCK (dev-mlock isn't a valid flag; harmless CLI redefined)
          ports:
            - name: vault-api
              containerPort: 8200
              protocol: TCP
            - name: vault-metrics
              containerPort: 8201
              protocol: TCP
          env:
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
            # Real token injected from Secret. `optional: false` (default)
            # so the pod refuses to start if the Secret is missing — fail
            # closed instead of silently starting with an empty token.
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: root-token
            # Enable Prometheus exposition at /v1/sys/metrics.
            - name: VAULT_METRIC_ENABLE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Vault writes to /vault/data.
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              # IPC_LOCK: mlock, prevents secrets from swapping to disk.
              # SETFCAP: vault's entrypoint self-applies cap_ipc_lock via
              # setcap on its own binary at startup — needs this to do so.
              # SETUID/SETGID: entrypoint runs as root then su-exec's down
              # to the vault user — su-exec needs these to drop privilege.
              # NET_RAW: needed in this nested-virt dev env's network stack.
              add: ["IPC_LOCK", "SETFCAP", "SETUID", "SETGID", "NET_RAW"]
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 5
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: vault-tmp
              mountPath: /tmp
      volumes:
        - name: vault-data
          emptyDir: {}
        - name: vault-tmp
          emptyDir: {}  # readOnlyRootFilesystem is false above, but /tmp
                        # gets its own writable volume to limit blast radius.
---
# ConfigMap — Vault setup job script: enables KV v2 engine + Kubernetes auth
# method + per-service policies + seeds secrets.
# Configuration references only the `VAULT_TOKEN` env injected from the
# cross-namespace `vault-root-token` Secret — no committed token string.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-setup
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-setup
    app.kubernetes.io/part-of: devops-platform
data:
  setup.sh: |
    #!/bin/sh
    set -e

    : "${VAULT_ADDR:?"VAULT_ADDR must be set"}"
    : "${VAULT_TOKEN:?"VAULT_TOKEN must be set (from cross-namespace Secret ref)"}"

    echo "Wait for Vault to be ready..."
    for i in $(seq 1 60); do
      if vault status 2>/dev/null | grep -q "Initialized.*true"; then
        break
      fi
      echo "Vault not ready, retry ($i/60)..."
      sleep 2
    done

    # Enable KV v2 secrets engine at path "secret/"
    echo "Enable KV v2 secrets engine at secret/ ..."
    vault secrets enable -path=secret kv-v2 || true

    # Enable the Kubernetes auth method so microservices can authenticate
    # with their own ServiceAccount JWT — no shared root token at runtime.
    echo "Enable kubernetes auth method..."
    vault auth enable kubernetes || true
    vault write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc.cluster.local" \
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt || true

    # ── Per-service provisioning — discovery-driven ────────────────────────
    # Service names come from the `devops-service-list` ConfigMap (synced by
    # the CI deploy job from app/*/Dockerfile scan). No service name is
    # hardcoded here: add/remove a service dir and this loops adapts.
    for svc in $SERVICES; do
      echo "Provisioning Vault access for $svc ..."

      # Least-privilege read-only policy scoped to the service's KV path.
      cat <<EOF | vault policy write "devops-platform-${svc}" -
    path "secret/data/devops-platform/${svc}" {
      capabilities = ["read"]
    }
    path "secret/metadata/devops-platform/${svc}" {
      capabilities = ["read", "list"]
    }
    EOF

      # Bind the app ServiceAccount to its Vault policy via Kubernetes auth.
      vault write "auth/kubernetes/role/${svc}" \
        bound_service_account_names="${svc}-sa" \
        bound_service_account_namespaces="devops-platform" \
        policies="devops-platform-${svc}" \
        ttl="1h" || true

      # Seed the path with real generated values. The app fails closed until
      # BOTH DATABASE_URL and JWT_SECRET_KEY are present and non-empty
      # (SERVICE_TEMPLATE SystemExits if either is falsy under production).
      # Idempotent per key: read existing values first, generate only the
      # keys that are missing or empty — a re-run never clobbers a real
      # secret an operator wrote out-of-band.
      if vault kv get -format=json secret/devops-platform/${svc} > /tmp/kv.json 2>/dev/null; then
        db=$(sed -n 's/.*"DATABASE_URL"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/kv.json)
        jw=$(sed -n 's/.*"JWT_SECRET_KEY"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/kv.json)
      else
        db=""
        jw=""
      fi
      [ -n "$db" ] || db="postgresql://app:$(od -An -N 12 -tx1 /dev/urandom | tr -d ' \n')@postgres-${svc}.devops-platform.svc.cluster.local:5432/${svc}"
      [ -n "$jw" ] || jw="$(od -An -N 32 -tx1 /dev/urandom | tr -d ' \n')"
      vault kv put secret/devops-platform/${svc} DATABASE_URL="$db" JWT_SECRET_KEY="$jw" || true
    done

    echo "Vault setup complete. Sealed: $(vault status | grep Sealed | awk '{print $2}')"
    echo "!! Secrets are auto-generated — DATABASE_URL points at a not-yet-existing postgres-<svc> host."
---
# Job — Runs the setup script once Vault is running
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-setup-job
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-setup-job
    app.kubernetes.io/part-of: devops-platform
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-setup-job
        app.kubernetes.io/part-of: devops-platform
    spec:
      serviceAccountName: vault-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: vault-setup
          image: hashicorp/vault:1.15.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/setup.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: VAULT_ADDR
              value: "http://vault-service.vault.svc.cluster.local:8200"
            # Real token injected from the cross-namespace `vault-root-token`
            # Secret via a cross-namespace reference (apps namespace → vault).
            # Requires the Role/RoleBinding below (already present).
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: root-token
            # Service list synced by the CI deploy job (discovery of
            # app/*/Dockerfile). Required: the Job fails fast if missing.
            - name: SERVICES
              valueFrom:
                configMapKeyRef:
                  name: devops-service-list
                  key: services
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: setup-script
          configMap:
            name: vault-setup
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
---
# ServiceAccount — Vault uses this SA for Kubernetes auth + setup Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-sa
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-sa
    app.kubernetes.io/part-of: devops-platform
---
# Vault needs to read secrets (own dev setup) + mint SA tokens per service
# for the Kubernetes auth method.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-auth-role
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-auth-role
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-auth-rolebinding
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-auth-rolebinding
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: vault-sa
    namespace: vault
roleRef:
  kind: Role
  name: vault-auth-role
  apiGroup: rbac.authorization.k8s.io
---
# Cross-namespace secret access: the vault-setup Job runs in the `vault`
# namespace but reads the root token from the `vault-root-token` Secret in
# `devops-platform`. A RoleBinding there grants vault-sa get/list/watch on
# that specific Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-token-reader
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: vault-token-reader
    app.kubernetes.io/part-of: devops-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vault-root-token"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-token-reader-binding
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: vault-token-reader-binding
    app.kubernetes.io/part-of: devops-platform
subjects:
  - kind: ServiceAccount
    name: vault-sa
    namespace: vault
roleRef:
  kind: Role
  name: vault-token-reader
  apiGroup: rbac.authorization.k8s.io
