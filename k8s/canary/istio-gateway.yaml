# Istio Gateway + VirtualServices for ArgoCD + Flagger mesh control.
#
# Exposes the 3 microservices (users, products, orders) on the public mesh
# gateway at distinct HTTP routes. Flagger creates additional VirtualServices
# per service for the primary/canary traffic split during Canary releases.
#
# Spec ref: arborescence.md Phase 5 — k8s/canary/istio-gateway.yaml
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: devops-platform-gateway
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: devops-platform-gateway
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: users-virtualservice
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
spec:
  hosts:
    - "*"
  gateways:
    - devops-platform-gateway
  http:
    - match:
        - uri:
            prefix: /users
      route:
        - destination:
            host: users-service
            port:
              number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: products-virtualservice
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: products-service
    app.kubernetes.io/part-of: devops-platform
spec:
  hosts:
    - "*"
  gateways:
    - devops-platform-gateway
  http:
    - match:
        - uri:
            prefix: /products
      route:
        - destination:
            host: products-service
            port:
              number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orders-virtualservice
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devops-platform
spec:
  hosts:
    - "*"
  gateways:
    - devops-platform-gateway
  http:
    - match:
        - uri:
            prefix: /orders
      route:
        - destination:
            host: orders-service
            port:
              number: 80
