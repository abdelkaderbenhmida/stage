# flagger-loadtester — Flagger reference implementation of a webhook target
# for Canary analysis. Without it Flagger checks `HTTP req response` against
# nil → rollback never triggers (false-pass).
#
# Spec: https://flagger.app/docs/usage/how-it-works/#load-testing
# Uses Vert.x by default for the loadtester (smallest dep + Java fits slim).
# Bound to Service `flagger-loadtester.devops-platform`. Canary analysis
# webhooks target `http://flagger-loadtester.devops-platform/` for the
# `hey -Z 5m` command.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: flagger-loadtester
    app.kubernetes.io/part-of: devops-platform
    app.kubernetes.io/version: 0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagger-loadtester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger-loadtester
        app.kubernetes.io/part-of: devops-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadtester
          image: ghcr.io/fluxcd/flagger-loadtester:0.27.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: flagger-loadtester
    app.kubernetes.io/part-of: devops-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: flagger-loadtester
