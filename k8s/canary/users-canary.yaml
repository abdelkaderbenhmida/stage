apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: users-service
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: devops-platform
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-service
  service:
    name: users-service
    port: 80
    targetPort: http
  analysis:
    # Phase 4 / Incident 6: progressive rollout 10%→100% with 5-minute analysis.
    # interval 30s × maxWeight 100 × step 10 = 10 steps × 30s ≈ 5 min analysis window.
    # threshold 2 = auto-rollback after 2 failed metric checks (Flagger builtin).
    interval: 30s
    threshold: 2
    maxWeight: 100
    stepWeight: 10
    primaryReadyThreshold: 30
    canaryReadyThreshold: 30
    webhooks:
      - name: load-test
        url: http://flagger-loadtester.devops-platform/
        timeout: 5s
        metadata:
          # 5-minute load test aligns with the analysis window.
          cmd: "hey -z 5m -q 10 -c 2 http://users-service-canary.devops-platform/"
  progressDeadlineSeconds: 300
