apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: orders-service
  namespace: devops-platform
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devops-platform
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  service:
    name: orders-service
    port: 80
    targetPort: http
  analysis:
    # Phase 4 / Incident 6: progressive rollout 10%→100% with 5-minute analysis.
    interval: 30s
    threshold: 2
    maxWeight: 100
    stepWeight: 10
    primaryReadyThreshold: 30
    canaryReadyThreshold: 30
    webhooks:
      - name: load-test
        url: http://flagger-loadtester.devops-platform/
        timeout: 5s
        metadata:
          cmd: "hey -z 5m -q 10 -c 2 http://orders-service-canary.devops-platform/"
  progressDeadlineSeconds: 300
