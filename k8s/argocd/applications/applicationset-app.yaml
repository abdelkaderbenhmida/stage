# ApplicationSet bootstrap Application. Without this, k8s/argocd/applicationset.yaml
# is dead YAML: the old flow only ever applied k8s/argocd/install (the control
# plane). This app-of-apps entry makes the ApplicationSet itself GitOps-owned,
# consistent with the other 9 files in this directory. It also owns project.yaml,
# which the ApplicationSet's Applications require to exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-applicationset
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-applicationset
    app.kubernetes.io/part-of: devops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-platform
  source:
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: secondary
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
