apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: devops-platform
  source:
    # Phase 5 / cahier des charges §3: Grafana deployed via official Helm chart
    # (grafana/grafana v8.0.0) wrapped in a local umbrella chart
    # (k8s/monitoring/grafana/Chart.yaml). values.yaml configures datasources +
    # dashboard provider + references the 4 spec'd dashboards (overview/perf/
    # errors/infra-detail) provisioned from k8s/monitoring/grafana/dashboards/.
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: main
    path: k8s/monitoring/grafana
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
