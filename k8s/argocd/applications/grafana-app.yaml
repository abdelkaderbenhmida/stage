apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: devops-platform
  source:
    # Grafana is deployed from the MANIFEST set in this directory
    # (deployment.yaml + service.yaml + rbac.yaml + secret.yaml + the datasource
    # and dashboard-provider ConfigMaps), NOT via the grafana/grafana umbrella
    # chart, matching the operator-model choice made for prometheus-app.
    #
    # The umbrella chart and these manifests both lived here and described the
    # same Deployment with DIFFERENT selectors. Helm only ever renders
    # templates/, so the manifests were dead to GitOps, and any operator who
    # applied them by hand (as docs/disaster-recovery.md instructs) created an
    # object ArgoCD could never reconcile — sync failed permanently with
    # `Deployment.apps "grafana" is invalid: spec.selector: ... immutable`.
    #
    # Do NOT reintroduce a Chart.yaml here: ArgoCD auto-detects Helm from its
    # presence alone, which silently resurrects that conflict.
    # The 4 spec'd dashboards are a separate Application (grafana-dashboards)
    # sourced from k8s/monitoring/grafana/dashboards/.
    repoURL: __GITHUB_REPO_URL__
    targetRevision: secondary
    path: k8s/monitoring/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
