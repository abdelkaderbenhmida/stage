apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: devops-platform
  source:
    # Phase 5 / cahier des charges §3: monitoring deployed via Helm charts
    # (paramétrables) instead of raw manifests. This Application points at a
    # local umbrella chart (k8s/monitoring/prometheus/Chart.yaml) that pulls
    # prometheus-community/prometheus v25.8.0 as a dependency and applies the
    # values from values.yaml (scrape interval 15s, serviceMonitors, retention,
    # alerting_rules.yml). crds.yaml here installs the ServiceMonitor/
    # PrometheusRule CRDs other manifests reference — the parallel Operator
    # manifest path that used to live in this directory was removed, it
    # never worked since the Operator itself was never deployed.
    repoURL: git@github.com:abdelkaderbenhmida/stage.git
    targetRevision: main
    path: k8s/monitoring/prometheus
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # See elk-app.yaml for why: StatefulSet volumeClaimTemplates diffing is a
  # documented upstream ArgoCD limitation, not real drift (sync succeeds
  # every time on prometheus-alertmanager despite the permanent OutOfSync).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
