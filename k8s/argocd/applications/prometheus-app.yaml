apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: devops-platform
  source:
    # Phase 5 / cahier des charges §3: monitoring deployed via Helm charts
    # (paramétrables) instead of raw manifests. This Application points at a
    # local umbrella chart (k8s/monitoring/prometheus/Chart.yaml) that pulls
    # prometheus-community/prometheus v25.8.0 as a dependency and applies the
    # values from values.yaml (scrape interval 15s, serviceMonitors, retention).
    # The repo also keeps a manifest set under k8s/monitoring/prometheus/*.yaml
    # as a fallback path; enable ONE of the two (helm OR manifests), not both.
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: secondary
    path: k8s/monitoring/prometheus
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
