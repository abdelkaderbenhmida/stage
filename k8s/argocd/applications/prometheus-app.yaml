apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: devops-platform
  source:
    # Prometheus is deployed as the prometheus-operator MANIFEST set
    # (crds.yaml + operator.yaml + prometheus.yaml + rbac.yaml + service.yaml),
    # NOT as a Helm chart. This is the "enable ONE of the two" choice the old
    # comment here called for, resolved in favour of the operator.
    #
    # Why the operator and not prometheus-community/prometheus: the whole
    # platform is built on operator CRs — the apps chart ships a ServiceMonitor,
    # slo-rules ships a PrometheusRule, and alertmanager ships an Alertmanager
    # CR. A plain community-chart Prometheus reads none of those, so the umbrella
    # chart produced a second, parallel Prometheus that silently scraped nothing
    # while the CRs sat unreconciled.
    #
    # Do NOT reintroduce a Chart.yaml in this directory: ArgoCD auto-detects any
    # path containing Chart.yaml as Helm, which makes Helm render templates/ only
    # and silently ignore every manifest above — the exact failure this replaces.
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: secondary
    path: k8s/monitoring/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
