apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitops
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Early: every tenant Application this platform creates has this git
    # server as its source, so nothing tenant-facing can sync before it runs.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: devops-platform
  source:
    repoURL: __GITHUB_REPO_URL__
    targetRevision: secondary
    path: k8s/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
