apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk
  namespace: argocd
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: devops-platform
  source:
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: secondary
    path: k8s/monitoring/elk
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # A StatefulSet's volumeClaimTemplates can never match git.
  #
  # The API server defaults apiVersion, kind and volumeMode into each template
  # and attaches a status block, none of which a manifest can express — a PVC
  # template's status is not a thing you write. ArgoCD therefore reports the
  # StatefulSet OutOfSync forever, and a permanently-OutOfSync Application is
  # worse than cosmetic: it hides any real drift underneath it, and there is no
  # sync that clears it.
  #
  # Scoped to this one field of this one kind, so genuine changes to the
  # StatefulSet — image, resources, affinity — are still detected.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: elasticsearch
      namespace: monitoring
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
