apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk
  namespace: argocd
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: devops-platform
  source:
    repoURL: git@github.com:abdelkaderbenhmida/stage.git
    targetRevision: main
    path: k8s/monitoring/elk
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Kubernetes echoes back extra fields on StatefulSet volumeClaimTemplates
  # (e.g. status) that never match the git-declared spec, so ArgoCD reports
  # a permanent diff on the elasticsearch StatefulSet even though sync
  # itself succeeds every time (verified: last syncResult says "Synced").
  # Documented upstream ArgoCD limitation, not a real drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
