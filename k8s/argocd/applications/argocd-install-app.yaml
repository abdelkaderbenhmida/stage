# ArgoCD self-bootstrap Application.
# Sync-wave -100 so the control-plane lands before ANY ArgoCD Application
# (sync waves 0+). Uses kustomize remote pin in k8s/argocd/install/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-install
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-install
    app.kubernetes.io/part-of: devops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-platform
  source:
    repoURL: git@github.com:abdelkaderbenhmida/stage.git
    targetRevision: HEAD
    path: k8s/argocd/install
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      # applicationsets.argoproj.io alone exceeds the 262144-byte
      # last-applied-configuration annotation limit even with
      # ServerSideApply on this ArgoCD version — same class of failure as
      # the Calico CRDs in the Ansible k8s_master role. Replace=true skips
      # the three-way merge/annotation path for this Application's syncs.
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
