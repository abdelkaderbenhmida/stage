apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-shared
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-shared
    app.kubernetes.io/part-of: devops-platform
  annotations:
    argocd.argoproj.io/sync-wave: '5'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-platform
  source:
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: secondary
    path: k8s/apps/chart
    helm:
      parameters:
      - name: renderShared
        value: 'true'
      - name: renderSharedOnly
        value: 'true'
      - name: services[0].name
        value: catalog-items
      - name: services[1].name
        value: orders-service
      - name: services[2].name
        value: products-service
      - name: services[3].name
        value: users-service
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
