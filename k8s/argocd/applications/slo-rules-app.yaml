apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-rules
  namespace: argocd
  labels:
    app.kubernetes.io/name: slo-rules
    app.kubernetes.io/part-of: devops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-platform
  source:
    repoURL: https://github.com/abdelkaderbenhmida/stage.git
    targetRevision: main
    path: k8s/monitoring/alertmanager
    # Only rules.yaml inside this folder is applied (file filter in ArgoCD).
    # OR drop this file and merge content into alertmanager-app.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
