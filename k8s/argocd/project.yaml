apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devops-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform
    app.kubernetes.io/part-of: devops-platform
spec:
  description: DevOps Central Platform — FastAPI microservices.
  sourceRepos:
    - __GITHUB_REPO_URL__
  destinations:
    - namespace: devops-platform
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    # promtail lives here, not in `monitoring`: that namespace enforces the
    # PodSecurity "restricted" profile and a log collector needs hostPath
    # mounts and root. Without this entry loki-app never syncs, so the
    # tenant Logs panel has no backend even though the manifests are in git.
    - namespace: logging
      server: https://kubernetes.default.svc
    # The manifest repository every tenant Application syncs from.
    - namespace: gitops
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: flagger-system
      server: https://kubernetes.default.svc
    # argocd-install-app and applicationset-app both deploy INTO this
    # namespace (self-management). Without it they fail spec validation with
    # "destination ... do not match any of the allowed destinations in
    # project 'devops-platform'" and never sync — the ApplicationSet then
    # never regenerates, so no per-service Application is created either.
    - namespace: argocd
      server: https://kubernetes.default.svc
  # Cluster-scoped kinds this project is allowed to manage. Namespace/Service/
  # ConfigMap alone are not enough: argocd-install-app renders the upstream
  # ArgoCD manifests, which carry CRDs and cluster-scoped RBAC.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
