# One ArgoCD Application per discovered service — the git `files` generator
# scans `app/*/main.py` (flat) and `app/*/*/main.py` (grouped apps), so ANY
# directory under app/ that implements the service contract becomes an app.
# `app/shared` is excluded automatically (no main.py). Nested services get
# the k8s name "<app>-<service>". No service name appears anywhere in this file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-platform-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-apps
    app.kubernetes.io/part-of: devops-platform
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/<owner>/<repo>.git
        revision: main
        files:
          - path: "app/*/main.py"
          - path: "app/*/*/main.py"
  template:
    metadata:
      name: '{{ $p := splitList "/" .path }}{{ if eq (len $p) 4 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
      labels:
        app.kubernetes.io/name: '{{ $p := splitList "/" .path }}{{ if eq (len $p) 4 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
        app.kubernetes.io/part-of: devops-platform
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devops-platform
      source:
        repoURL: https://github.com/<owner>/<repo>.git
        targetRevision: main
        path: k8s/apps/chart
        helm:
          parameters:
            - name: services[0].name
              value: '{{ $p := splitList "/" .path }}{{ if eq (len $p) 4 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: devops-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m