# One ArgoCD Application per discovered service — the `files` generator over a
# per-service marker app/<svc>/service.yaml containing {name, tag} (see WS-C1).
#
# Trade-off: a second marker file per service (main.py remains the discovery
# contract for CI and introspect.py; service.yaml is ArgoCD's only).
#
# The `files` generator parses YAML, so the marker CAN be parsed (main.py
# cannot), and it matches individual files — group folders like app/catalog
# (no main.py, no marker) never produce an Application, killing the phantom
# `catalog` Application that the old `directories` generator produced.
#
# The template reads {{ .name }} / {{ .tag }} directly — no splitList path
# gymnastics, and zero hardcoded service names. No service name is hardcoded
# anywhere in this file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-platform-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-apps
    app.kubernetes.io/part-of: devops-platform
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/abdelkaderbenhmida/stage.git
        revision: secondary
        files:
          # ONE generator, doublestar `**`, covering both layouts:
          #   flat    app/<svc>/service.yaml
          #   grouped app/<app>/<svc>/service.yaml
          # Must NOT be split into two generators (`app/*/service.yaml` plus
          # `app/*/*/service.yaml`): ArgoCD's matcher lets `*` cross `/`, so
          # the flat pattern ALSO matches the nested marker and every grouped
          # service is generated twice — "contains applications with duplicate
          # name: <svc>", which aborts generation for the whole set.
          - path: "app/**/service.yaml"
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        app.kubernetes.io/name: '{{ .name }}'
        app.kubernetes.io/part-of: devops-platform
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devops-platform
      source:
        repoURL: https://github.com/abdelkaderbenhmida/stage.git
        targetRevision: secondary
        path: k8s/apps/chart
        helm:
          parameters:
            - name: services[0].name
              value: '{{ .name }}'
            - name: services[0].tag
              value: '{{ .tag | default "secondary" }}'
            - name: renderShared
              value: "false"
      destination:
        server: https://kubernetes.default.svc
        namespace: devops-platform
      # The HorizontalPodAutoscaler owns spec.replicas at runtime. The chart also
      # renders a replicas value, so with selfHeal + ServerSideApply ArgoCD kept
      # rewriting the field back and the autoscaler never held a scale-up:
      # `SuccessfulRescale New size: 4` fired 9 times in 22 minutes while the
      # Deployment stayed at 2. Ignoring the field hands replica count to the HPA
      # and leaves everything else under GitOps control.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
