# One ArgoCD Application per discovered service. Uses the git `directories`
# generator (path presence only, no file content parsed — the `files`
# generator would try to YAML-parse main.py itself and fail). Two path
# generators cover flat (app/<service>) and grouped (app/<app>/<service>)
# layouts; `app/shared` is excluded as a structural convention (utility
# code, not a service), same exclusion the discovery script uses.
# Nested services get the k8s name "<app>-<service>". No service name is
# hardcoded anywhere in this file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-platform-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-apps
    app.kubernetes.io/part-of: devops-platform
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/<owner>/<repo>.git
        revision: secondary
        directories:
          - path: "app/*"
          - path: "app/shared"
            exclude: true
    - git:
        repoURL: https://github.com/<owner>/<repo>.git
        revision: secondary
        directories:
          - path: "app/*/*"
  template:
    metadata:
      name: '{{ $p := splitList "/" .path.path }}{{ if eq (len $p) 3 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
      labels:
        app.kubernetes.io/name: '{{ $p := splitList "/" .path.path }}{{ if eq (len $p) 3 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
        app.kubernetes.io/part-of: devops-platform
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devops-platform
      source:
        repoURL: https://github.com/<owner>/<repo>.git
        targetRevision: secondary
        path: k8s/apps/chart
        helm:
          parameters:
            - name: services[0].name
              value: '{{ $p := splitList "/" .path.path }}{{ if eq (len $p) 3 }}{{ index $p 1 }}-{{ index $p 2 }}{{ else }}{{ index $p 1 }}{{ end }}'
            - name: renderShared
              value: "false"
      destination:
        server: https://kubernetes.default.svc
        namespace: devops-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m