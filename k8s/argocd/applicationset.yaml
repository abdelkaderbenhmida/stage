# One ArgoCD Application per discovered service — the git `files` generator
# scans `app/*/main.py`, so ANY directory under app/ that implements the
# service contract becomes an app. `app/shared` is excluded automatically
# (no main.py). No service name appears anywhere in this file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-platform-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: devops-platform-apps
    app.kubernetes.io/part-of: devops-platform
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/<owner>/<repo>.git
        revision: main
        files:
          - path: "app/*/main.py"
  template:
    metadata:
      name: "{{ index (splitList \"/\" .path) 1 }}"
      labels:
        app.kubernetes.io/name: "{{ index (splitList \"/\" .path) 1 }}"
        app.kubernetes.io/part-of: devops-platform
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devops-platform
      source:
        repoURL: https://github.com/<owner>/<repo>.git
        targetRevision: main
        path: k8s/apps/chart
        helm:
          parameters:
            - name: services[0].name
              value: "{{ index (splitList \"/\" .path) 1 }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: devops-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m