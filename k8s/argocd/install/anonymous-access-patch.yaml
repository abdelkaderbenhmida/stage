# Read-only anonymous access — lets the platform UI embed the ArgoCD web
# console directly (iframe) without a separate login. Scoped to `role:readonly`
# (view-only: no sync, no edit, no secrets) via the built-in RBAC role.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  users.anonymous.enabled: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  policy.default: role:readonly
---
# Disable frame-blocking headers so the platform UI can embed the ArgoCD
# console in an iframe (view-only, matches the anonymous role:readonly above).
#
# --insecure serves that UI over plain HTTP on the service's `http` port. It
# downgrades nothing reachable: argocd-server is ClusterIP-only and the
# platform reaches it through an on-demand `kubectl port-forward` bound to
# 127.0.0.1, so the hop is loopback plus the API server's own TLS. Without the
# flag port 80 answers 307 to https, and the https port presents ArgoCD's
# self-signed certificate — which a browser can only accept through an
# interstitial, and interstitials do not render inside an iframe. The embed is
# a silent blank box in that state, which is exactly how it failed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          args:
            - /usr/local/bin/argocd-server
            - --x-frame-options=
            - --content-security-policy=
            - --insecure
