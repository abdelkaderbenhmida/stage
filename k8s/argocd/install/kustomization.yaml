# ArgoCD control-plane install (manifest officiel via kustomize remote).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/path: kustomization.yaml

# Pin to argo-cd v2.7.16 (stable, certified for k8s 1.28). Updating the tag
# here is the ONLY place to bump ArgoCD — Applications below auto-consume it.
resources:
  - https://github.com/argoproj/argo-cd/manifests/core-install?ref=v2.7.16

patches:
  - path: anonymous-access-patch.yaml

namespace: argocd

# Harden install: set explicit namespace override on resources that hardcode
# `argocd` (the upstream manifests already target argocd, the namespace
# keyword is a safety net for idempotency).
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: argocd

images:
  - name: quay.io/argoproj/argocd:v2.7.16
    newTag: v2.7.16
  - name: quay.io/argoproj/argocd:latest
    newName: quay.io/argoproj/argocd
    newTag: v2.7.16
