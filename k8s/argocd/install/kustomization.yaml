# ArgoCD control-plane install (manifest officiel via kustomize remote).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/path: kustomization.yaml

# Pin to argo-cd v3.5.1. Updating the tag here is the ONLY place to bump
# ArgoCD — Applications below auto-consume it.
#
# Version floor is set by the CLUSTER, not by preference: ArgoCD diffs live
# objects against a bundled OpenAPI schema, so a control plane newer than the
# ArgoCD build fails every diff with
#   "error building typed value from live resource:
#    .status.terminatingReplicas: field not declared in schema"
# and every Application parks at SYNC=Unknown (health still computes, which
# makes it look deceptively fine). `.status.terminatingReplicas` landed in
# k8s 1.33; the previous v2.7.16 pin ("certified for k8s 1.28") could not
# diff anything on a modern cluster. Re-check this pin when bumping the
# cluster's k8s version.
#
# `cluster-install` (NOT `core-install`): core-install ships the controller
# only, with no argocd-server/dex — the anonymous-access patch below targets the
# argocd-server Deployment and silently no-ops (or errors) without it, and the
# platform UI's embedded console has no API to talk to. cluster-install is
# namespace-install + cluster-rbac + crds, i.e. the full control plane.
#
# It must be a DIRECTORY that contains a kustomization.yaml. `manifests/install`
# is not one — upstream ships `install.yaml` as a pre-rendered FILE, and the
# kustomize bases are cluster-install / namespace-install / core-install. Naming
# a non-existent directory fails late and misleadingly, as a clone that appears
# to succeed followed by
#   evalsymlink failure on '/tmp/kustomize-.../manifests/install': no such file
# `timeout` + `submodules=false` are kustomize remote-fetch options, not
# decoration: kustomize defaults to a 27s timeout on the `git fetch` behind a
# remote base and clones submodules it never needs. On a slow or jittery link
# that fetch overruns and the whole Application fails to render with
#   "hit 27s timeout running '/usr/bin/git fetch --depth=1 ...'"
# leaving argocd-install permanently at SYNC=Unknown.
resources:
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.1&timeout=300&submodules=false

patches:
  - path: anonymous-access-patch.yaml
  - path: timeouts-patch.yaml

namespace: argocd

# Harden install: set explicit namespace override on resources that hardcode
# `argocd` (the upstream manifests already target argocd, the namespace
# keyword is a safety net for idempotency).
#
# `labels` + includeSelectors:false, not the deprecated `commonLabels`:
# commonLabels also rewrites matchLabels/selectors, which are immutable on an
# existing Deployment/StatefulSet — every upgrade would fail with
# "field is immutable" until the workload is deleted by hand.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: argocd

images:
  - name: quay.io/argoproj/argocd
    newTag: v3.5.1
