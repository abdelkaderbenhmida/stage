# ArgoCD control-plane install (manifest officiel via kustomize remote).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/path: kustomization.yaml

# Pin to argo-cd v3.5.1. Updating the tag here is the ONLY place to bump
# ArgoCD — Applications below auto-consume it.
#
# Previously pinned at v2.7.16 in this file while the actual 15-day cluster
# that every ArgoCD screenshot in the report was captured against had
# drifted, unrecorded, to v3.5.1 — the report text said v2.7.16 in six
# places, every figure showed v3.5.1. Found auditing the report; a from-
# scratch rebuild off this file installs the version it names, so v2.7.16
# was genuinely reproducible — just not what had actually been validated for
# 15 days. Bumped the pin to match the validated version instead of the
# other way around.
resources:
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.1

namespace: argocd

# Harden install: set explicit namespace override on resources that hardcode
# `argocd` (the upstream manifests already target argocd, the namespace
# keyword is a safety net for idempotency).
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: argocd

images:
  - name: quay.io/argoproj/argocd:v3.5.1
    newTag: v3.5.1
  - name: quay.io/argoproj/argocd:latest
    newName: quay.io/argoproj/argocd
    newTag: v3.5.1
